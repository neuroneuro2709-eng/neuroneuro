<script>const UI={"ru":{"nav":["Главная","Квизы","Библиотека","Открытые вопросы","Лаборатория","Статистика","Мои исследования","Сотрудничество","Обо мне"],"kick":"Исследуем мозг человека","title":"Узнайте, как работает ваш мозг","sub":"Нейронаука простым языком. Исследования, эксперименты и интерактивное изучение человеческого мозга.","disc":"Художественная визуализация, а не симуляция реальной нейронной активности.","c":[{"t":"Проверить знания","x":"Квизы по нейроанатомии, нейровизуализации, памяти и другим темам.","b":"К квизам →"},{"t":"Узнать себя","x":"Научно-популярные опросники о сне, привычках и когнитивном опыте.","b":"К опросникам →"},{"t":"Разрушить мифы","x":"Разбор популярных заблуждений о мозге с научными источниками.","b":"К статьям →"}],"qzTag":"01 · Знания","qzTitle":"Каталог квизов","qzSub":"Пять квизов: таймер 30 секунд и объяснение после каждого вопроса.","libTag":"02 · Библиотека","libTitle":"Статьи и разборы","libSub":"Каждая публикация: утверждение → что говорит наука → источник.","oqTag":"03 · Границы знаний","oqTitle":"Чего мы пока не знаем","oqIntro":"Мозг — одна из самых сложных систем, которые когда-либо пыталось изучить человечество. Мы знаем, как нейроны передают сигналы и как формируются воспоминания. Но понимание отдельных механизмов ещё не означает, что мы понимаем систему целиком. Этот раздел — о границах современных знаний.","oqWhy":"Почему эти вопросы важны","oqWhy1":"Незнание — не признак неудачи науки. Это обозначение границы между тем, что подтверждено исследованиями, и тем, что ещё предстоит выяснить.","oqWhy2":"Каждый нерешённый вопрос — возможность для нового эксперимента, пересмотра теории или обнаружения механизма, о котором раньше не подозревали.","oqSlogan":"Исследуем известное. Ставим под вопрос неизвестное.","labTag":"04 · Лаборатория","labTitle":"Интерактивная лаборатория","labSub":"Brain Explorer, эксперимент Струпа и опросник «Узнать себя» — инструменты без правильных ответов, с честными ограничениями интерпретации.","beT":"🧠 Brain Explorer","beH":"Нажмите на область, чтобы узнать, за что она отвечает. Стилизованная схема, не анатомическая карта.","beDef":"Выберите область мозга.","stT":"🎨 Эксперимент Струпа","stH":"Слово обозначает цвет, но написано другим. Нажимайте кнопку цвета шрифта, преодолевая автоматическое чтение. 10 раундов на скорость.","stStart":"Начать эксперимент","stRound":"Раунд","stAgain":"Ещё раз","stAvg":"Среднее время","stAcc":"Точность","stDone":"Готово!","svT":"📋 Опросник «Узнать себя»","svH":"10 утверждений о сне, стрессе и цифровой усталости. Это образовательный самоотчёт, а не медицинская диагностика.","svBtn":"Рассчитать когнитивный профиль","svTitle":"Ваш профиль","svNote":"Пирог: «усталость» — ниже лучше; «сон» и «внимание» — выше лучше. Оценки примерные.","sc":["Совсем нет","Скорее нет","Средне","Скорее да","Полностью да"],"scS":"Сон и режим","scA":"Внимание","scF":"Усталость","stTag":"05 · Цифры","stTitle":"Проект в цифрах","stDemo":"Средние результаты по квизам (демо-данные — реальные появятся после подключения сбора статистики):","nQz":"тем квизов","nQ":"вопросов с объяснениями","nCog":"когнитивных эксперимента","nMy":"научных разборов","rsTag":"06 · Портфолио","rsTitle":"Мои исследования","rsSub":"Учебные проекты, методология и честные ограничения методов — ядро академического портфолио.","meth":"Методология. Тесты и опросники разработаны на основе учебников Purves «Neuroscience», Bear «Neuroscience: Exploring the Brain» и Huettel «Brain Imaging». Дисклеймер: проект не является медицинским инструментом и не заменяет консультацию врача.","clTag":"07 · Сотрудничество","clTitle":"Открыта к сотрудничеству","clSub":"Соединяю любопытство и нейронауку: научная коммуникация, интерактивное обучение, учебные исследования.","clNote":"Важно: статус проекта — «Open to collaboration», а не «In collaboration with»: реальных соглашений пока нет, и я считаю, что честность здесь важнее солидности. Для академических запросов — neuroneuro26@gmail.com.","abTag":"08 · Обо мне","abTitle":"Обо мне","ab1":"Меня зовут София Беркутова. neuroneuro начался с простого вопроса: почему мы думаем, чувствуем и поступаем именно так — и почему об этом так мало честных, доступных объяснений?","ab2":"Этот проект — мой способ разобраться самому и поделиться: я перевожу нейронауку с языка исследований на понятный язык, без упрощений до потери смысла и без стен из терминов. Мои академические интересы — нейробиология, когнитивная наука и нейровизуализация; целевая цель — направление Brain and Cognitive Sciences в KAIST.","ab3":"Проект — не витрина, а тренировочная площадка: каждый квиз, эксперимент и статья — это и контент, и инженерная работа, и тренировка научной коммуникации.","stages":[["ЭТАП 1","Главная страница, навигация, три направления, перенос квиза."],["ЭТАП 2","Интерактивность: Brain Explorer, опросники, эксперимент Струпа, нейрофакт дня."],["ЭТАП 3","Научное портфолио: статьи, библиотека источников, методология, открытая статистика."],["ДАЛЬШЕ","Сбор реальных данных, новые квизы, новые эксперименты."]],"ftT":"Есть вопрос или идея?","ftX":"Я читаю все сообщения и рада обсудить нейронауку, идеи для новых квизов или сотрудничество.","ftTg":"Telegram-канал","ftF":"neuroneuro — независимый образовательный проект. Материалы и опросники носят научно-популярный характер, не являются медицинским инструментом и не заменяют консультацию врача.","ftC":"Created by SOFIIA BERKUTOVA","correct":"Верно!","wrong":"Не совсем","next":"Далее","again":"Пройти ещё раз","score":"Ваш результат","qof":"Вопрос","open":"Открыть","timeOut":"Время вышло","close":"Закрыть","lock":"Скоро","ready":"Готов","mini":"Мини","soon":"Скоро","demo":"демо","claim":"Утверждение","science":"Что говорит наука","srcL":"Источник","unkTitle":"Что мы пока не знаем:"},"en":{"nav":["Home","Quizzes","Library","Open questions","Lab","Stats","Research","Collaboration","About"],"kick":"Exploring the human brain","title":"Learn how your brain works","sub":"Neuroscience in plain language. Research, experiments and interactive exploration of the human brain.","disc":"Artistic visualization, not a simulation of real neural activity.","c":[{"t":"Test your knowledge","x":"Quizzes on neuroanatomy, neuroimaging, memory and more.","b":"To the quizzes →"},{"t":"Discover yourself","x":"Popular-science questionnaires about sleep, habits and cognitive experience.","b":"To the questionnaires →"},{"t":"Bust the myths","x":"Popular brain myths examined with scientific sources.","b":"To the articles →"}],"qzTag":"01 · Knowledge","qzTitle":"Quiz catalog","qzSub":"Five quizzes: a 30-second timer and an explanation after every question.","libTag":"02 · Library","libTitle":"Articles and reviews","libSub":"Every piece: a claim → what science says → the source.","oqTag":"03 · Frontiers","oqTitle":"What we don't know yet","oqIntro":"The brain is one of the most complex systems humanity has ever tried to study. We know how neurons transmit signals and how memories form. Yet understanding single mechanisms does not mean understanding the whole system. This section is about the limits of modern knowledge.","oqWhy":"Why these questions matter","oqWhy1":"Not knowing is not a failure of science. It marks the border between what research has confirmed and what remains to be found out.","oqWhy2":"Every open question is a chance for a new experiment, a revised theory, or a mechanism nobody suspected.","oqSlogan":"We explore the known. We question the unknown.","labTag":"04 · Lab","labTitle":"Interactive lab","labSub":"Brain Explorer, the Stroop task and the self-discovery questionnaire — tools with no right answers and honest limits of interpretation.","beT":"🧠 Brain Explorer","beH":"Tap an area to see what it does. A stylized scheme, not an anatomical map.","beDef":"Select a brain area.","stT":"🎨 The Stroop task","stH":"The word names one color but is printed in another. Tap the button matching the font color, fighting the urge to read. 10 rounds for speed.","stStart":"Start","stRound":"Round","stAgain":"Again","stAvg":"Average time","stAcc":"Accuracy","stDone":"Done!","svT":"📋 Self-discovery questionnaire","svH":"10 statements about sleep, stress and digital fatigue. An educational self-report, not medical diagnosis.","svBtn":"Calculate my cognitive profile","svTitle":"Your profile","svNote":"Note: lower «fatigue» is better; higher «sleep» and «attention» are better. Rough estimates only.","sc":["Not at all","Rather no","Neutral","Rather yes","Fully yes"],"scS":"Sleep & routine","scA":"Attention","scF":"Fatigue","stTag":"05 · Numbers","stTitle":"The project in numbers","stDemo":"Average quiz results (demo data — real numbers will appear once analytics is connected):","nQz":"quiz topics","nQ":"questions with explanations","nCog":"cognitive experiments","nMy":"science reviews","rsTag":"06 · Portfolio","rsTitle":"My research","rsSub":"Course projects, methodology and honest limitations — the core of an academic portfolio.","meth":"Methodology. The tests are based on Purves' «Neuroscience», Bear's «Neuroscience: Exploring the Brain» and Huettel's «Brain Imaging». Disclaimer: this project is not a medical tool and does not replace a doctor's consultation.","clTag":"07 · Collaboration","clTitle":"Open to collaboration","clSub":"Combining curiosity and neuroscience: science communication, interactive learning, course research.","clNote":"Note: the project status is «Open to collaboration», not «In collaboration with» — there are no real agreements yet, and I believe honesty matters more than looks. Academic inquiries: neuroneuro26@gmail.com.","abTag":"08 · About","abTitle":"About me","ab1":"My name is Sofiia Berkutova. neuroneuro began with a simple question: why do we think, feel and act this way — and why are there so few honest, accessible explanations?","ab2":"This project is my way to understand and share: translating neuroscience from the language of papers into plain language, without dumbing it down or hiding behind jargon. My academic in  nucleus of a neuron","ko":"뉴런의 핵","ja":"ニューロンの核"},{"ru":"Контакт между нейронами для передачи сигнала","en":"A contact between neurons that passes signals","ko":"신호를 전달하는 뉴런 간 접점","ja":"ニューロン間で信号を伝える接点"},{"ru":"Мембрана клетки","en":"The cell membrane","ko":"세포막","ja":"細胞膜"},{"ru":"Тип глиальной клетки","en":"A type of glial cell","ko":"일종의 신경교세포","ja":"グリア細胞の一種"}],"c":1,"e":{"ru":"Синапс — место связи нейронов: сигнал передаётся химически (нейромедиаторами) или электрически.","en":"A synapse is the junction between neurons: the signal passes chemically (via neurotransmitters) or electrically.","ko":"시냅스는 뉴런 사이 연결 지점으로, 신경전달물질(화학) 또는 전기적으로 신호가 전달됩니다.","ja":"シナプスはニューロン間の接合部で、神経伝達物質（化学的）または電気的に信号が伝わります。"}},{"q":{"ru":"Какой нейромедиатор в первую очередь связан с удовольствием и мотивацией?","en":"Which neurotransmitter is primarily linked to pleasure and motivation?","ko":"쾌락과 동기와 가장 관련된 신경전달물질은?","ja":"快楽と動機に主に関わる神経伝達物質は？"},"o":[{"ru":"Серин","en":"Serine","ko":"세린","ja":"セリン"},{"ru":"Гистамин","en":"Histamine","ko":"히스타민","ja":"ヒスタミン"},{"ru":"Дофамин","en":"Dopamine","ko":"도파민","ja":"ドーパミン"},{"ru":"Таурин","en":"Taurine","ko":"타우린","ja":"タウリン"}],"c":2,"e":{"ru":"Дофамин — это скорее нейромедиатор мотивации и обучения, чем «гормон удовольствия» в чистом виде.","en":"Dopamine is more a neurotransmitter of motivation and learning than a pure «pleasure hormone».","ko":"도파민은 순수한 「쾌락 호르몬」이라기보다 동기와 학습의 신경전달물질에 가깝습니다.","ja":"ドーパミンは純粋な「快楽ホルモン」というより、動機づけと学習に関わる伝達物質です。"}},{"q":{"ru":"Что делает миелиновая оболочка?","en":"What does the myelin sheath do?","ko":"미엘린(수초)의 역할은?","ja":"ミエリン鞘の役割は？"},"o":[{"ru":"Синтезирует нейромедиаторы","en":"Synthesizes neurotransmitters","ko":"신경전달물질 합성","ja":"神経伝達物質の合成"},{"ru":"Ускоряет проведение импульса по аксону","en":"Speeds up impulse conduction along the axon","ko":"축삭 신호 전도를 가속","ja":"軸索の信号伝導を速める"},{"ru":"Разрушает отработанные синапсы","en":"Destroys spent synapses","ko":"낡은 시냅스를 파괴","ja":"古いシナプスを破壊"},{"ru":"Хранит глюкозу","en":"Stores glucose","ko":"포도당 저장","ja":"グルコースを貯蔵"}],"c":1,"e":{"ru":"Миелин — «изоляция» аксона: сигнал перескакивает по перехватам Ранвье и движется в разы быстрее.","en":"Myelin is the axon's insulation: the signal jumps along nodes of Ranvier and moves many times faster.","ko":"미엘린은 축삭의 「절연체」로, 신호가 랑비에 절편을 뛰어넘어 수배 빠르게 이동합니다.","ja":"ミエリンは軸索の絶縁体で、信号はランビエ絞輪を跳び越え、数倍速く進みます。"}},{"q":{"ru":"Какая доля кислорода, потребляемого телом в покое, приходится на мозг?","en":"What share of the body's oxygen at rest does the brain use?","ko":"휴식 시 몸이 소비하는 산소 중 뇌가 차지하는 비율은?","ja":"安静時に体が消費する酸素のうち脳が占める割合は？"},"o":[{"ru":"около 5%","en":"about 5%","ko":"약 5%","ja":"約5%"},{"ru":"около 20%","en":"about 20%","ko":"약 20%","ja":"約20%"},{"ru":"около 50%","en":"about 50%","ko":"약 50%","ja":"約50%"},{"ru":"около 80%","en":"about 80%","ko":"약 80%","ja":"約80%"}],"c":1,"e":{"ru":"Мозг весит около 2% массы тела, но потребляет примерно 20% кислорода и глюкозы.","en":"The brain is about 2% of body mass but consumes roughly 20% of oxygen and glucose.","ko":"뇌는 체중의 약 2%지만 산소와 포도당의 약 20%를 소비합니다.","ja":"脳は体重の約2%だが、酸素とグルコースの約20%を消費します。"}},{"q":{"ru":"Что такое нейропластичность?","en":"What is neuroplasticity?","ko":"신경가소성이란?","ja":"神経可塑性とは？"},"o":[{"ru":"Способность мозга менять связи в ответ на опыт","en":"The brain's ability to change connections in response to experience","ko":"경험에 따라 연결을 바꾸는 뇌의 능력","ja":"経験に応じて結合を変える脳の能力"},{"ru":"Уменьшение числа нейронов с возрастом","en":"The decrease of neuron count with age","ko":"나이에 따른 뉴런 수 감소","ja":"加齢によるニューロン数の減少"},{"ru":"Неизменность мозга после 25 лет","en":"The brain's unchangeability after age 25","ko":"25세 이후 뇌의 불변성","ja":"25歳以降の脳の不変性"},{"ru":"Способность делить клетки","en":"The ability to divide cells","ko":"세포 분열 능력","ja":"細胞分裂の能力"}],"c":0,"e":{"ru":"Пластичность — основа обучения: синапсы усиливаются или ослабляются, и связи перестраиваются всю жизнь.","en":"Plasticity underlies learning: synapses strengthen or weaken, and connections rewire throughout life.","ko":"가소성은 학습의 기반입니다. 시냅스가 강해지거나 약해지며 연결은 평생 재편됩니다.","ja":"可塑性は学習の基盤です。シナプスが強まったり弱まったりし、結合は生涯再編されます。"}}]},{"id":"meth","icon":"🔬","title":{"ru":"Методы нейровизуализации","en":"Neuroimaging methods","ko":"뇌영상 방법","ja":"脳イメージング法"},"desc":{"ru":"Как заглядывают внутрь живого мозга.","en":"How researchers peer into a living brain.","ko":"살아있는 뇌를 들여다보는 방법.","ja":"生きている脳を覗く方法。"},"q":[{"q":{"ru":"Что измеряет фМРТ?","en":"What does fMRI measure?","ko":"fMRI는 무엇을 측정하나요?","ja":"fMRIは何を測定しますか？"},"o":[{"ru":"Электрические волны мозга","en":"Brain electric waves","ko":"뇌의 전기파","ja":"脳の電気的波"},{"ru":"Изменения кровотока как косвенный признак активности","en":"Blood-flow changes as an indirect sign of activity","ko":"활동의 간접 지표인 혈류 변화","ja":"活動の間接指標である血流変化"},{"ru":"Нейромедиаторы напрямую","en":"Neurotransmitters directly","ko":"신경전달물질 직접","ja":"神経伝達物質の直接測定"},{"ru":"Генетический код","en":"The genetic code","ko":"유전자 코드","ja":"遺伝コード"}],"c":1,"e":{"ru":"фМРТ ловит BOLD-сигнал — изменение соотношения оксигенированной и деоксигенированной крови возле активных зон.","en":"fMRI detects the BOLD signal — changes in the ratio of oxygenated to deoxygenated blood near active regions.","ko":"fMRI는 BOLD 신호를 감지합니다. 활동 영역 근처의 산소화 혈액 비율 변화입니다.","ja":"fMRIはBOLD信号を検出します。活動領域近くの酸素化血液の比率変化です。"}},{"q":{"ru":"Какой метод даёт лучшее временное разрешение?","en":"Which method offers the best temporal resolution?","ko":"어떤 방법이 시간 분해능이 가장 좋나요?","ja":"時間分解能が最も高いのは？"},"o":[{"ru":"МРТ","en":"MRI","ko":"MRI","ja":"MRI"},{"ru":"фМРТ","en":"fMRI","ko":"fMRI","ja":"fMRI"},{"ru":"ЭЭГ","en":"EEG","ko":"EEG","ja":"EEG"},{"ru":"КТ","en":"CT","ko":"CT","ja":"CT"}],"c":2,"e":{"ru":"ЭЭГ регистрирует активность с точностью до миллисекунд, но плохо определяет источник сигнала в глубине.","en":"EEG registers activity within milliseconds but poorly localizes deep sources.","ko":"EEG는 밀리초 단위로 기록하지만 깊은 곳의 신호원 찾기는 약합니다.","ja":"EEGはミリ秒単位で記録しますが、深部の信号源特定は苦手です。"}},{"q":{"ru":"На чём основано МРТ?","en":"What is MRI based on?","ko":"MRI의 원리는?","ja":"MRIの原理は？"},"o":[{"ru":"Рентгеновские лучи","en":"X-rays","ko":"X선","ja":"X線"},{"ru":"Магнитное поле и радиоволны","en":"Magnetic field and radio waves","ko":"자기장과 전파","ja":"磁場と電波"},{"ru":"Ультразвук","en":"Ultrasound","ko":"초음파","ja":"超音波"},{"ru":"Инфракрасный свет","en":"Infrared light","ko":"적외선","ja":"赤外線"}],"c":1,"e":{"ru":"МРТ использует сильное магнитное поле и радиоволны, чтобы «выслушать» отклик атомов водорода в тканях.","en":"MRI uses a strong magnetic field and radio waves to listen to the response of hydrogen atoms in tissue.","ko":"MRI는 강한 자기장과 전파로 조직 내 수소 원자의 반응을 들여다봅니다.","ja":"MRIは強磁場と電波で組織内の水素原子の応答を読み取ります。"}},{"q":{"ru":"Главное ограничение фМРТ?","en":"The main limitation of fMRI?","ko":"fMRI의 주요 한계는?","ja":"fMRIの主な限界は？"},"o":[{"ru":"Слишком высокая цена","en":"Too expensive","ko":"비용이 너무 비쌈","ja":"費用が高すぎる"},{"ru":"Сигнал косвенный и запаздывает на секунды","en":"The signal is indirect and lags by seconds","ko":"신호가 간접적이고 수 초 지연","ja":"信号が間接的で数秒遅れる"},{"ru":"Нельзя использовать на людях","en":"Cannot be used on humans","ko":"사람에게 사용 불가","ja":"人には使えない"},{"ru":"Не видит мозга вообще","en":"Does not see the brain at all","ko":"뇌가 전혀 보이지 않음","ja":"脳がまったく見えない"}],"c":1,"e":{"ru":"Кровоток реагирует на активность с задержкой в несколько секунд — это ставит предел временному разрешению.","en":"Blood flow responds to activity with a delay of seconds, which caps temporal resolution.","ko":"혈류 반응은 수 초 지연되며, 이것이 시간 분해능의 한계입니다.","ja":"血流反応は数秒の遅れがあり、これが時間分解能の限界です。"}},{"q":{"ru":"Что может ЭЭГ лучше всего?","en":"What is EEG best at?","ko":"EEG가 가장 잘하는 것은?","ja":"EEGが最も得意なことは？"},"o":[{"ru":"Смотреть на отдельные нейроны","en":"Looking at single neurons","ko":"개별 뉴런 관찰","ja":"単一ニューロンの観察"},{"ru":"Следить за динамикой ритмов во времени","en":"Tracking rhythm dynamics over time","ko":"리듬의 시간적 변화 추적","ja":"リズムの時間的変化の追跡"},{"ru":"Показывать точную глубину активности","en":"Showing exact depth of activity","ko":"활동의 정확한 깊이 표시","ja":"活動の正確な深さの表示"},{"ru":"Заменять МРТ полностью","en":"Fully replacing MRI","ko":"MRI 완전 대체","ja":"MRIの完全な代替"}],"c":1,"e":{"ru":"ЭЭГ идеальна для ритмов и эпилепсии: альфа, тета, дельта — читаются почти в реальном времени.","en":"EEG is ideal for rhythms and epilepsy: alpha, theta, delta are read almost in real time.","ko":"EEG는 리듬과 간질에 이상적입니다. 알파, 세타, 델타가 거의 실시간으로 읽힙니다.","ja":"EEGはリズムとてんかんに理想的で、アルファ波やシータ波をほぼリアルタイムで読めます。"}}]},{"id":"myth","icon":"🧩","title":{"ru":"Мифы о мозге","en":"Brain myths","ko":"뇌 미신","ja":"脳の神話"},"desc":{"ru":"Проверь, что из этого правда.","en":"Check which of it is true.","ko":"무엇이 진실인지 확인하세요.","ja":"どれが真実か確かめましょう。"},"q":[{"q":{"ru":"Мы используем только 10% мозга. Правда?","en":"We use only 10% of our brain. True?","ko":"우리는 뇌의 10%만 사용한다. 사실인가요?","ja":"私たちは脳の10%しか使わない。本当ですか？"},"o":[{"ru":"Правда","en":"True","ko":"사실이다","ja":"本当"},{"ru":"Ложь","en":"False","ko":"거짓이다","ja":"嘘"},{"ru":"Только у гениев","en":"Only for geniuses","ko":"천재만 해당","ja":"天才のみ"},{"ru":"Только во сне","en":"Only during sleep","ko":"수면 중에만","ja":"睡眠中のみ"}],"c":1,"e":{"ru":"ПЭТ и фМРТ показывают: за день активны практически все области. Миф возник из-за неточной цитаты начала XX века.","en":"PET and fMRI show nearly all areas are active daily. The myth grew from a loose quote of the early 20th century.","ko":"PET와 fMRI는 거의 모든 영역이 매일 활성화됨을 보여줍니다. 20세기 초의 부정확한 인용이 미신을 낳았습니다.","ja":"PETやfMRIではほぼ全領域が日々活動していることが分かります。20世紀初頭の不正確な引用が神話を生みました。"}},{"q":{"ru":"Люди делятся на «левополушарных» и «правополушарных»?","en":"Are people divided into left-brained and right-brained?","ko":"사람은 좌뇌형과 우뇌형으로 나뉘나요?","ja":"人は左脳型と右脳型に分かれますか？"},"o":[{"ru":"Да, это доказано","en":"Yes, proven","ko":"네, 증명됨","ja":"はい、証明済み"},{"ru":"Нет — полушария работают вместе","en":"No — the hemispheres work together","ko":"아니요 — 반구는 함께 작동","ja":"いいえ — 半球は協調して働く"},{"ru":"Только у левшей","en":"Only in left-handers","ko":"왼손잡이만","ja":"左利きのみ"},{"ru":"Только у детей","en":"Only in children","ko":"아이들만","ja":"子どものみ"}],"c":1,"e":{"ru":"Оба полушария участвуют почти во всех задачах; специализация есть, но «доминирование» — преувеличение.","en":"Both hemispheres take part in nearly all tasks; there is specialization, but «dominance» is an exaggeration.","ko":"양 반구는 거의 모든 과제에 참여합니다. 특수화는 있지만 「지배」는 과장입니다.","ja":"両半球はほぼ全課題に関与します。特化はありますが「支配」は誇張です。"}},{"q":{"ru":"После 25 лет мозг больше не меняется?","en":"After 25 the brain stops changing?","ko":"25세 이후 뇌는 변하지 않나요?","ja":"25歳以降の脳は変わらない？"},"o":[{"ru":"Да","en":"Yes","ko":"네","ja":"はい"},{"ru":"Нет — пластичность сохраняется всю жизнь","en":"No — plasticity lasts a lifetime","ko":"아니요 — 가소성은 평생 유지","ja":"いいえ — 可塑性は生涯続く"},{"ru":"Только у спортсменов","en":"Only in athletes","ko":"운동선수만","ja":"アスリートのみ"},{"ru":"Наука не знает","en":"Science doesn't know","ko":"과학은 모른다","ja":"科学は知らない"}],"c":0,"e":{"ru":"Миф! Нейрогенез в гиппокампе и перестройка связей продолжаются и во взрослом возрасте.","en":"Myth! Hippocampal neurogenesis and rewiring continue into adulthood.","ko":"미신입니다. 해마의 신경발생과 연결 재편은 성인기에도 계속됩니다.","ja":"神話です。海馬の神経新生と結合の再編は成人期にも続きます。"}},{"q":{"ru":"«Эффект Моцарта» делает человека умнее?","en":"Does the Mozart effect make you smarter?","ko":"「モーツァルト効果」は人を賢くしますか？","ja":"「モーツァルト効果」で人は賢くなりますか？"},"o":[{"ru":"Да, навсегда","en":"Yes, forever","ko":"네, 영원히","ja":"はい、永久に"},{"ru":"Нет — эффект кратковременный и связан с активацией, а не интеллектом","en":"No — the effect is short-lived and about arousal, not intelligence","ko":"아니요 — 효과는 일시적이며 지능이 아닌 각성과 관련","ja":"いいえ — 効果は短期的で知能ではなく覚醒に関係"},{"ru":"Только у младенцев","en":"Only in infants","ko":"영아만","ja":"乳児のみ"},{"ru":"Только при 10 часов в день","en":"Only with 10 hours a day","ko":"하루 10시간만","ja":"1日10時間のみ"}],"c":1,"e":{"ru":"Rauscher и коллеги (1993) фиксировали краткосрочный подъём на пространственных задачах; рост IQ не подтверждён.","en":"Rauscher et al. (1993) found a short-term boost on spatial tasks; no IQ gain was confirmed.","ko":"Rauscher 등(1993)은 공간 과제에서 일시적 향상을 보였지만 IQ 상승은 확인되지 않았습니다.","ja":"Rauscherら（1993）は空間課題での一時的な向上を示したが、IQ向上は確認されていません。"}},{"q":{"ru":"Учебные стили: «аудиал учатся на слух, визуал — глазами». Научно?","en":"Learning styles: auditory learners learn by ear, visual by eyes. Scientific?","ko":"학습 스타일: 청각형은 귀로, 시각형은 눈으로 학습한다. 과학적?","ja":"学習スタイル：聴覚型は耳で、視覚型は目で学ぶ。科学的？"},"o":[{"ru":"Да","en":"Yes","ko":"네","ja":"はい"},{"ru":"Нет — подстройка под стили не улучшает результат","en":"No — matching styles does not improve outcomes","ko":"아니요 — 스타일 맞춤은 결과를 개선하지 않음","ja":"いいえ — スタイル合わせは成果を改善しない"},{"ru":"Да, но только у взрослых","en":"Yes, but only in adults","ko":"네, 성인만","ja":"はい、成人のみ"},{"ru":"Зависит от погоды","en":"Depends on the weather","ko":"날씨에 따라 다름","ja":"天候次第"}],"c":1,"e":{"ru":"Метаанализы не находят пользы от подстройки под «стили»; работают активное вспоминание и распределённое повторение.","en":"Meta-analyses find no benefit from style-matching; active recall and spaced repetition work.","ko":"메타분석에서 스타일 맞춤의 효과는 없었습니다. 능동적 회상과 분산 반복이 효과적입니다.","ja":"メタ分析ではスタイル合わせの効果は見つかっていません。能動的想起と分散反復が有効です。"}}]},{"id":"sleep","icon":"😴","title":{"ru":"Сон","en":"Sleep","ko":"수면","ja":"睡眠"},"desc":{"ru":"Что мозг делает, пока вы спите.","en":"What the brain does while you sleep.","ko":"당신이 자는 동안 뇌가 하는 일.","ja":"眠っている間に脳がすること。"},"q":[{"q":{"ru":"Сколько стадий у сна (включая REM)?","en":"How many sleep stages are there (including REM)?","ko":"수면 단계는 몇 개인가요(REM 포함)?","ja":"睡眠段階はいくつありますか（REM含む）？"},"o":[{"ru":"2","en":"2","ko":"2","ja":"2"},{"ru":"3","en":"3","ko":"3","ja":"3"},{"ru":"4 NREM + REM","en":"4 NREM + REM","ko":"4 NREM + REM","ja":"4 NREM + REM"},{"ru":"8","en":"8","ko":"8","ja":"8"}],"c":2,"e":{"ru":"NREM делится на три стадии (N1, N2, N3-медленноволновой сон) плюс REM — всего четыре сегмента цикла.","en":"NREM has three stages (N1, N2, N3 slow-wave sleep) plus REM — four segments of the cycle.","ko":"NREM은 세 단계(N1, N2, N3 서파 수면)로 나뉘고 REM까지 총 네 구간입니다.","ja":"NREMは3段階（N1、N2、N3徐波睡眠）に分かれ、REMを含め計4区分です。"}},{"q":{"ru":"Когда сны самые яркие и странные?","en":"When are dreams the most vivid and strange?","ko":"가장 생생하고 기묘한 꿈은 언제?","ja":"最も生々しく奇妙な夢はいつ？"},"o":[{"ru":"В глубоком N3","en":"In deep N3","ko":"깊은 N3에서","ja":"深いN3で"},{"ru":"В REM-фазе","en":"In REM sleep","ko":"REM 단계에서","ja":"REM睡眠中"},{"ru":"При засыпании","en":"While falling asleep","ko":"잠들 때","ja":"入眠時"},{"ru":"Ровно в полдень","en":"Exactly at noon","ko":"정오에","ja":"正午ちょうど"}],"c":1,"e":{"ru":"REM-сон: глаза двигаются, а ЭЭГ похожа на бодрствование — здесь живут самые яркие сны.","en":"REM sleep: eyes move and the EEG resembles wakefulness — the most vivid dreams live here.","ko":"REM 수면: 눈이 움직이고 EEG는 깨어있을 때와 유사합니다. 가장 생생한 꿈이 여기서 나타납니다.","ja":"REM睡眠：眼球運動があり、脳波は覚醒時と似ます。最も生々しい夢はここに出ます。"}},{"q":{"ru":"Что происходит с памятью во сне?","en":"What happens to memory during sleep?","ko":"수면 중 기억에 일어나는 일은?","ja":"睡眠中、記憶に何が起きますか？"},"o":[{"ru":"Она полностью стирается","en":"It is fully erased","ko":"완전히 지워짐","ja":"完全に消去される"},{"ru":"Консолидируется — переносится в долговременное хранение","en":"It consolidates — moves into long-term storage","ko":"통합되어 장기 저장으로 이동","ja":"固定され長期貯蔵へ移る"},{"ru":"Она не затрагивается","en":"It is untouched","ko":"영향 없음","ja":"影響されない"},{"ru":"Удваивается","en":"It doubles","ko":"두 배가 됨","ja":"2倍になる"}],"c":1,"e":{"ru":"Повторное «проигрывание» активности гиппокампа во сне укрепляет новые следы памяти.","en":"Replay of hippocampal activity during sleep strengthens new memory traces.","ko":"수면 중 해마 활동의 재생이 새로운 기억 흔적을 강화합니다.","ja":"睡眠中の海馬活動の再生が新しい記憶痕跡を強化します。"}},{"q":{"ru":"Сколько сна нужно взрослому в среднем?","en":"How much sleep does an adult need on average?","ko":"성인에게 필요한 평균 수면량은?","ja":"成人が必要とする平均睡眠時間は？"},"o":[{"ru":"4-5 часов","en":"4-5 hours","ko":"4-5시간","ja":"4～5時間"},{"ru":"7-9 часов","en":"7-9 hours","ko":"7-9시간","ja":"7～9時間"},{"ru":"11-12 часов","en":"11-12 hours","ko":"11-12시간","ja":"11～12時間"},{"ru":"Не нужно вообще","en":"None at all","ko":"필요 없음","ja":"不要"}],"c":1,"e":{"ru":"Консенсус AASM/NSF: взрослым — 7-9 часов; меньше 6 — риск для внимания и здоровья.","en":"AASM/NSF consensus: adults need 7-9 hours; under 6 risks attention and health.","ko":"AASM/NSF 합의: 성인은 7-9시간. 6시간 미만은 주의력과 건강에 위험.","ja":"AASM/NSFの合意：成人は7～9時間。6時間未満は注意と健康にリスク。"}},{"q":{"ru":"Можно ли «доспать» выходными за всю неделю?","en":"Can weekend sleep repay a whole week's deficit?","ko":"주말에 일주일치 잠을 만회할 수 있나요?","ja":"週末で一週間分の睡眠を取り戻せますか？"},"o":[{"ru":"Да, полностью","en":"Yes, fully","ko":"네, 완전히","ja":"はい、完全に"},{"ru":"Частично — но метаболические и когнитивные «долги» остаются","en":"Partly — but metabolic and cognitive debts remain","ko":"부분적으로 — 대사적·인지적 「빚」은 남음","ja":"部分的に — 代謝と認知の「負債」は残る"},{"ru":"Нет, совсем","en":"No, not at all","ko":"아니요, 전혀","ja":"いいえ、全く"},{"ru":"Только если спать днём","en":"Only if napping","ko":"낮잠을 자야만","ja":"昼寝すればのみ"}],"c":1,"e":{"ru":"Исследования (напр. Depner et al., 2019) показывают: дозы сна на выходных не отменяют эффектов недосыпа.","en":"Studies (e.g., Depner et al., 2019) show weekend catch-up sleep does not erase the effects of sleep debt.","ko":"연구(Depner 등, 2019)에 따르면 주말 보충 수면은 수면 부채의 영향을 지우지 못합니다.","ja":"研究（Depnerら、2019）では、週末の補償睡眠は睡眠負債の影響を消しません。"}}]}];
const MYTHS=[{"t":{"ru":"10% мозга","en":"The 10% brain","ko":"뇌의 10%","ja":"脳の10%"},"s":"no","c":{"ru":"Используем только десятую часть мозга.","en":"We use only a tenth of our brain.","ko":"뇌의 10분의 1만 사용한다.","ja":"脳の1割しか使わない。"},"x":{"ru":"ПЭТ и фМРТ за день фиксируют активность практически во всех областях. Миф продаёт «скрытые резервы», которых нет.","en":"PET and fMRI detect activity in almost all areas daily. The myth sells hidden reserves that simply don't exist.","ko":"PET와 fMRI는 하루 동안 거의 모든 영역의 활성을 기록합니다. 미신은 존재하지 않는 「숨은 잠재력」을 팝니다.","ja":"PETやfMRIは1日でほぼ全領域の活動を記録します。神話は存在しない「隠れた可能性」を売るものです。"},"src":{"ru":"Beyerstein, 1999 · Nature Reviews Neuroscience","en":"Beyerstein, 1999 · Nature Reviews Neuroscience","ko":"Beyerstein, 1999 · Nature Reviews Neuroscience","ja":"Beyerstein, 1999 · Nature Reviews Neuroscience"}},{"t":{"ru":"Левое и правое полушарие","en":"Left and right hemispheres","ko":"좌뇌와 우뇌","ja":"左脳と右脳"},"s":"no","c":{"ru":"Люди делятся на «логиков» и «художников» по полушарию.","en":"People split into «logicians» and «artists» by hemisphere.","ko":"사람은 반구에 따라 「논리형」과 「예술형」으로 나뉜다.","ja":"人は半球によって「論理型」と「芸術型」に分かれる。"},"x":{"ru":"Специализация полушарий существует (например, речь чаще слева), но обе стороны работают вместе в любом сложном деле.","en":"Hemisphere specialization exists (speech is usually left), but both sides work together in any complex task.","ko":"반구 특수화는 존재하지만(예: 언어는 보통 좌뇌) 복잡한 과제에서는 양쪽이 함께 작동합니다.","ja":"半球の特化は存在します（言語は通常左）が、複雑な課題では両側が協調します。"},"src":{"ru":"Corballis, 2014 · PMC","en":"Corballis, 2014 · PMC","ko":"Corballis, 2014 · PMC","ja":"Corballis, 2014 · PMC"}},{"t":{"ru":"Эффект Моцарта","en":"The Mozart effect","ko":"모차르트 효과","ja":"モーツァルト効果"},"s":"mid","c":{"ru":"Классика делает умнее.","en":"Classical music makes you smarter.","ko":"클래식이 더 똑똑하게 만든다.","ja":"クラシックは賢くする。"},"x":{"ru":"Краткосрочный подъём на пространственных задачах есть — но это скорее общая активация и настроение, а не рост интеллекта.","en":"There is a short-term boost on spatial tasks — but it's arousal and mood, not an IQ gain.","ko":"공간 과제에서 일시적 향상은 있지만, IQ 상승이 아니라 각성과 기분의 효과입니다.","ja":"空間課題での一時的向上はありますが、IQ向上ではなく覚醒と気分の効果です。"},"src":{"ru":"Rauscher et al., 1993 · Pietschnig et al., 2010","en":"Rauscher et al., 1993 · Pietschnig et al., 2010","ko":"Rauscher et al., 1993 · Pietschnig et al., 2010","ja":"Rauscher et al., 1993 · Pietschnig et al., 2010"}},{"t":{"ru":"Пластичность после 25","en":"Plasticity after 25","ko":"25세 이후 가소성","ja":"25歳以降の可塑性"},"s":"no","c":{"ru":"Мозг после 25 лет не способен меняться.","en":"The brain after 25 cannot change.","ko":"25세 이후 뇌는 변할 수 없다.","ja":"25歳以降の脳は変わらない。"},"x":{"ru":"Пластичность снижается с возрастом, но не исчезает: обучение новому в любом возрасте перестраивает связи.","en":"Plasticity declines with age but does not vanish: learning new things rewires connections at any age.","ko":"가소성은 나이에 따라 감소하지만 사라지지 않습니다. 새로운 학습은 어떤 나이에도 연결을 재편합니다.","ja":"可塑性は加齢で減少しますが消えません。新しい学習はどんな年齢でも結合を再編します。"},"src":{"ru":"Lövdén et al., 2010 · Nature Reviews Neuroscience","en":"Lövdén et al., 2010 · Nature Reviews Neuroscience","ko":"Lövdén et al., 2010 · Nature Reviews Neuroscience","ja":"Lövdén et al., 2010 · Nature Reviews Neuroscience"}},{"t":{"ru":"Сахар и гиперактивность","en":"Sugar and hyperactivity","ko":"설탕과 과잉행동","ja":"砂糖と多動"},"s":"no","c":{"ru":"Сладости делают детей гиперактивными.","en":"Sweets make children hyperactive.","ko":"단 것은 아이들을 과잉행동으로 만든다.","ja":"甘いものは子どもを多動にする。"},"x":{"ru":"Двойные слепые эксперименты не находят связи между сахаром и гиперактивностью; связь скорее ожидание родителей.","en":"Double-blind experiments find no link between sugar and hyperactivity; the link is mostly parental expectation.","ko":"이중맹 실험은 설탕과 과잉행동의 연관을 찾지 못했습니다. 연관은 주로 부모의 기대입니다.","ja":"二重盲検実験では砂糖と多動の関連は見つかりません。関連は主に親の期待です。"},"src":{"ru":"Wolraich et al., 1995 · JAMA","en":"Wolraich et al., 1995 · JAMA","ko":"Wolraich et al., 1995 · JAMA","ja":"Wolraich et al., 1995 · JAMA"}},{"t":{"ru":"Мозг «выключается» во сне","en":"The brain shuts off during sleep","ko":"수면 중 뇌가 꺼진다","ja":"睡眠中、脳はシャットダウンする"},"s":"no","c":{"ru":"Во сне мозг почти неактивен.","en":"During sleep the brain is almost inactive.","ko":"수면 중 뇌는 거의 비활성이다.","ja":"睡眠中、脳はほぼ不活性だ。"},"x":{"ru":"Мозг во сне активен: очистка метаболитов, консолидация памяти, сновидения — это работа, а не простой.","en":"The brain is active during sleep: metabolite clearance, memory consolidation, dreaming — work, not downtime.","ko":"수면 중 뇌는 활동적입니다. 대사물질 정리, 기억 통합, 꿈 — 일이지 쉼이 아닙니다.","ja":"睡眠中の脳は活動的です。代謝物の除去、記憶の固定、夢 — 働きであって休息ではありません。"},"src":{"ru":"Xie et al., 2013 · Science","en":"Xie et al., 2013 · Science","ko":"Xie et al., 2013 · Science","ja":"Xie et al., 2013 · Science"}},{"t":{"ru":"Левши креативнее","en":"Left-handers are more creative","ko":"왼손잡이가 더 창의적","ja":"左利きはより創造的"},"s":"mid","c":{"ru":"Левши по природе более творческие.","en":"Left-handers are naturally more creative.","ko":"왼손잡이는 본질적으로 더 창의적이다.","ja":"左利きは本質的により創造的だ。"},"x":{"ru":"Различия в средних показателях креативности между левшами и правшами малы; отдельные исследования показывают слабые эффекты, но общего правила нет.","en":"Average creativity differences between left- and right-handers are small; some studies show weak effects, but no general rule.","ko":"왼손잡이와 오른손잡이의 창의성 평균 차이는 작습니다. 일부 연구에서 약한 효과가 있지만 일반 법칙은 없습니다.","ja":"左利きと右利きの創造性の平均差は小さい。弱い効果を示す研究もあるが、一般法則はない。"},"src":{"ru":"Prichard et al., 2013 · Frontiers in Psychology","en":"Prichard et al., 2013 · Frontiers in Psychology","ko":"Prichard et al., 2013 · Frontiers in Psychology","ja":"Prichard et al., 2013 · Frontiers in Psychology"}},{"t":{"ru":"Слушание во сне","en":"Learning while sleeping","ko":"잠자는 동안 학습","ja":"眠っている間の学習"},"s":"no","c":{"ru":"Можно выучить язык, слушая записи во сне.","en":"You can learn a language by listening to recordings while asleep.","ko":"자는 동안 녹음을 들으면 언어를 배울 수 있다.","ja":"眠っている間に録音を聞いて語学を習得できる。"},"x":{"ru":"Сложное обучение во сне не работает. Зато во сне закрепляется то, что вы учили наяву — тонкое ассоциативное обучение возможно.","en":"Complex learning during sleep does not work. But sleep consolidates what you learned while awake — fine associative learning is possible.","ko":"수면 중 복잡한 학습은 효과가 없습니다. 그러나 깨어 있을 때 학습한 내용은 수면 중 강화됩니다.","ja":"睡眠中の複雑な学習は機能しません。ただし覚醒時に学習した内容は睡眠中に固定されます。"},"src":{"ru":"Andrillon et al., 2017 · Nature Communications","en":"Andrillon et al., 2017 · Nature Communications","ko":"Andrillon et al., 2017 · Nature Communications","ja":"Andrillon et al., 2017 · Nature Communications"}}];
const OPENQ=[{"t":{"ru":"Сознание — почему мы вообще что-то ощущаем?","en":"Consciousness — why do we experience anything at all?","ko":"의식 — 왜 우리는 무언가를 경험하는가?","ja":"意識 — なぜ私たちは何かを体験するのか？"},"x":{"ru":"Нейронаука умеет исследовать активность мозга, связанную с вниманием и восприятием. Но остаётся фундаментальный вопрос: почему физические процессы в нервной ткани сопровождаются субъективным переживанием?","en":"Neuroscience can study brain activity tied to attention and perception. Yet the fundamental question remains: why do physical processes in nervous tissue come with subjective experience?","ko":"신경과학은 주의와 지각에 연결된 뇌 활동을 연구할 수 있습니다. 그러나 근본적인 질문이 남습니다: 신경 조직의 물리적 과정은 왜 주관적 경험을 수반하는가?","ja":"神経科学は注意や知覚に関わる脳活動を研究できます。しかし根本的な問いが残ります。神経組織の物理的過程はなぜ主観的体験を伴うのか？"},"u":{"ru":"какие нейронные процессы необходимы для сознательного опыта и достаточно ли их для объяснения субъективных переживаний","en":"which neural processes are necessary for conscious experience and whether they suffice to explain subjective feelings","ko":"의식적 경험에 필요한 신경 과정이 무엇이며, 주관적 경험을 설명하기에 충분한지","ja":"意識的経験に必要な神経過程は何か、そして主観的体験を説明するのに十分か"}},{"t":{"ru":"Память — где на самом деле хранится воспоминание?","en":"Memory — where is a memory actually stored?","ko":"기억 — 기억은 실제로 어디에 저장되는가?","ja":"記憶 — 記憶は実際どこに保存されるのか？"},"x":{"ru":"Найдены энграммные клетки — группы нейронов, участвующие в представлении конкретных воспоминаний. Но память редко живёт в одной области: компоненты опыта распределены между несколькими сетями.","en":"Engram cells — groups of neurons representing specific memories — have been found. But memory rarely lives in one area: components of experience are distributed across several networks.","ko":"엔그램 세포 — 특정 기억을 표현하는 뉴런 집단 — 가 발견되었습니다. 그러나 기억은 한 영역에만 있지 않고 여러 네트워크에 분산됩니다.","ja":"エングラム細胞 — 特定の記憶を表すニューロン群 — が発見されています。しかし記憶は一つの領域にだけあるのではなく、複数のネットワークに分散します。"},"u":{"ru":"как распределённые нейронные изменения превращаются в устойчивое, целостное воспоминание","en":"how distributed neural changes   $("quizGrid").innerHTML=QUIZZES.map((q,i)=>'<div class="qcard" onclick="openQuiz('+i+')"><span class="lock">'+esc(L().ready)+'</span><div class="ic">'+q.icon+'</div><h4>'+esc(tx(q.title))+'</h4><p>'+esc(tx(q.desc))+'</p><div class="meta">'+q.q.length+' '+esc(L().qof)+'</div></div>').join("");

function closeQuizBox(){$("quizBox").innerHTML="";if(tmr){clearInterval(tmr);tmr=null;}}
function openQuiz(i){
  if(tmr){clearInterval(tmr);tmr=null;}
  cur=QUIZZES[i];qi=0;score=0;renderQ();
  document.getElementById("quizzes").scrollIntoView({behavior:"smooth"});
}
function renderQ(){
  tl=30;answered=false;const q=cur.q[qi];
  $("quizBox").innerHTML='<div class="qbox"><div class="qtop"><span>'+esc(tx(cur.title))+' · '+esc(L().qof)+' '+(qi+1)+'/'+cur.q.length+'</span><span class="tl" id="tlsp">30 s</span></div><div class="qtext">'+esc(tx(q.q))+'</div><div id="optbox">'+q.o.map((o,i)=>'<button class="opt" onclick="answer('+i+')">'+esc(tx(o))+'</button>').join("")+'</div><div id="explbox"></div></div>';
  tmr=setInterval(tick,1000);
}
function tick(){if(!answered){tl--;const s=$("tlsp");if(s)s.textContent=tl+' s';if(tl<=0)reveal(-1);}}
function answer(i){if(answered)return;answered=true;if(tmr){clearInterval(tmr);tmr=null;}reveal(i);}
function reveal(i){
  const q=cur.q[qi],ok=i===q.c;let good=i>=0&&ok;
  if(i===-1)good=false;
  if(i>=0&&ok)score++;
  const btns=$("optbox").querySelectorAll(".opt");
  btns.forEach((b,bi)=>{b.disabled=true;if(bi===q.c)b.classList.add("ok");else if(bi===i&&i!==-1)b.classList.add("bad");});
  const head=(i===-1)?L().timeOut:(ok?L().correct:L().wrong);
  $("explbox").innerHTML='<div class="expl"><b>'+esc(head)+'</b> '+esc(tx(q.e))+'</div><button class="btn" onclick="nextQ()">'+esc(L().next)+' →</button>';
}
function nextQ(){qi++;if(qi>=cur.q.length)showRes();else renderQ();}
function showRes(){
  const pct=Math.round(score/cur.q.length*100);
  $("quizBox").innerHTML='<div class="qbox resb"><div class="big">'+score+'/'+cur.q.length+'</div><p style="color:var(--mut);margin:10px 0 18px">'+esc(L().score)+' — '+pct+'%</p><button class="btn" onclick="openQuiz(QUIZZES.indexOf(cur))">'+esc(L().again)+'</button> <button class="btn ghost" onclick="closeQuizBox()" style="margin-left:8px">'+esc(L().close)+'</button></div>';
}

let stOn=false,stN=0,stOk=0,stRt=[],stColor=-1,stWord=-1,stT0=0;
function renderStroopIdle(){$("stroopBox").innerHTML='<button class="btn" onclick="startStroop()">'+esc(L().stStart)+'</button>';}
function startStroop(){stOn=true;stN=0;stOk=0;stRt=[];stroopRound();}
const stColors={ru:["красный","синий","зелёный","жёлтый"],en:["red","blue","green","yellow"],ko:["빨강","파랑","초록","노랑"],ja:["赤","青","緑","黄色"]};
const stHex=["#e0556a","#5a8bf6","#5ad17c","#ffd93b"];
function stroopRound(){
  if(stN>=10){stroopDone();return;}
  const c=stColors[lang]||stColors.ru;stWord=Math.floor(Math.random()*4);
  stColor=(Math.random()<0.75)?{0:1,1:2,2:3,3:0}[stWord]:stWord;
  const order=[0,1,2,3].sort(()=>Math.random()-0.5);
  $("stroopBox").innerHTML='<div class="qtop" style="align-self:stretch"><span>'+esc(L().stRound)+' '+(stN+1)+'/10</span><span class="tl" id="stTsp">—</span></div><div class="stword" style="color:'+stHex[stColor]+'">'+esc(c[stWord])+'</div><div class="sbtns">'+order.map(ci=>'<button class="sbtn" style="color:'+stHex[ci]+'" onclick="stroopClick('+ci+')">'+esc(c[ci])+'</button>').join("")+'</div>';
  stT0=Date.now();
}
function stroopClick(ci){
  if(!stOn)return;const rt=Date.now()-stT0;stRt.push(rt);if(ci===stColor)stOk++;
  stN++;stroopRound();
}
function stroopDone(){
  stOn=false;const avg=stRt.length?Math.round(stRt.reduce((a,b)=>a+b,0)/stRt.length):0;
  $("stroopBox").innerHTML='<div class="resb" style="width:100%"><div class="big" style="color:var(--acc2)">'+avg+' '+esc(L().stAvg).toLowerCase()+'</div><p style="color:var(--mut);margin:8px 0">'+esc(L().stAcc)+': '+stOk+'/10</p><button class="btn" onclick="startStroop()">'+esc(L().stAgain)+'</button></div>';
}

Iは血流を追跡します。活動するニューロンはより多くの酸素を必要とし、それが光として見えます。"}},{"q":{"ru":"Что измеряет ЭЭГ?","en":"What does EEG measure?","ko":"EEG는 무엇을 측정할까요?","ja":"EEGが測るものは？"},"o":[{"ru":"Отдельные нейроны","en":"Single neurons","ko":"개별 뉴런","ja":"単一のニューロン"},{"ru":"Суммарную активность миллионов нейронов через электроды на голове","en":"Summed activity of millions of neurons via scalp electrodes","ko":"두피 전극을 통한 수백만 뉴런의 종합 활동","ja":"頭皮の電極を通した数百万ニューロンの総和活動"},{"ru":"Гормоны","en":"Hormones","ko":"호르몬","ja":"ホルモン"},{"ru":"Температуру","en":"Temperature","ko":"온도","ja":"体温"}],"c":1,"e":{"ru":"Электроды на коже головы считывают волны совокупной активности: точность по времени высокая, а «адрес» источника размытый.","en":"Scalp electrodes pick up waves of summed activity — great timing, blurry source address.","ko":"두피 전극은 종합 활동의 파동을 읽어냅니다. 시간 정밀도는 높지만 근원 위치는 흐릿합니다.","ja":"頭皮の電極は総和活動の波を捉えます。時間分解能は高いが、発生源の位置はぼやけます。"}},{"q":{"ru":"Какой метод даёт самую детальную картину структуры мозга?","en":"Which method gives the most detailed structural picture?","ko":"어떤 방법이 구조를 가장 자세히 보여줄까요?","ja":"どの方法が構造を最も詳細に示す？"},"o":[{"ru":"ЭЭГ","en":"EEG","ko":"EEG","ja":"EEG"},{"ru":"МРТ высокого разрешения","en":"High-resolution MRI","ko":"고해상도 MRI","ja":"高解像度MRI"},{"ru":"Наблюдение","en":"Observation","ko":"관찰","ja":"観察"},{"ru":"Опрос","en":"Questionnaire","ko":"설문","ja":"質問紙"}],"c":1,"e":{"ru":"МРТ с сильным магнитом различает структуры размером в миллиметры — включая глубокие образования.","en":"High-field MRI resolves millimetre-scale structures — including deep ones.","ko":"고자장 MRI는 밀리미터 단위의 구조까지, 깊은 구조도 구별합니다.","ja":"強磁場MRIはミリメートル級の構造、深部構造も区別します。"}},{"q":{"ru":"Почему кровь приходит именно к активной области мозга?","en":"Why does blood rush to the active brain area?","ko":"왜 혈액은 활동적인 뇌 영역으로 갈까요?","ja":"なぜ血流は活動的な領域に向かう？"},"o":[{"ru":"Случайно","en":"By chance","ko":"우연히","ja":"偶然"},{"ru":"Активные нейроны потребляют больше кислорода и глюкозы","en":"Active neurons consume more oxygen and glucose","ko":"활동적인 뉴런은 더 많은 산소와 포도당을 소비한다","ja":"活動するニューロンはより多くの酸素とブドウ糖を消費する"},{"ru":"Чтобы охладить мозг","en":"To cool the brain","ko":"뇌를 식히기 위해","ja":"脳を冷やすため"},{"ru":"Кровь приносит сны","en":"Blood brings dreams","ko":"혈액은 꿈을 가져온다","ja":"血は夢をもたらす"}],"c":1,"e":{"ru":"Работающие нейроны требуют питания, и организм направляет туда дополнительный кровоток — этим и пользуется фМРТ.","en":"Working neurons need fuel, and the body routes extra bloodflow there — that's what fMRI exploits.","ko":"활동하는 뉴런은 연료가 필요하고, 몸은 그곳으로 추가 혈류를 보냅니다. fMRI가 이를 이용합니다.","ja":"働くニューロンは燃料を必要とし、体はそこへ血流を増やします。fMRIはこれを利用します。"}},{"q":{"ru":"Сколько примерно нейронов в мозге человека?","en":"Roughly how many neurons does the human brain have?","ko":"사람 뇌에는 대략 몇 개의 뉴런이 있을까요?","ja":"人間の脳には約いくつのニューロンがある？"},"o":[{"ru":"8,6 миллиарда","en":"8.6 billion","ko":"86억 개","ja":"86億個"},{"ru":"около 86 миллиардов","en":"about 86 billion","ko":"약 860억 개","ja":"約860億個"},{"ru":"860 тысяч","en":"860 thousand","ko":"86만 개","ja":"86万個"},{"ru":"8,6 триллиона","en":"8.6 trillion","ko":"8조6000억 개","ja":"8兆6000億個"}],"c":1,"e":{"ru":"Современный подсчёт (Azevedo и коллеги, 2009) даёт около 86 миллиардов нейронов.","en":"Modern counts (Azevedo et al., 2009) give about 86 billion neurons.","ko":"현대 계산(Azevedo 등, 2009)은 약 860억 개의 뉴런을 제시합니다.","ja":"現代の計数（Azevedoら，2009）は約860億個のニューロンを示します。"}},{"q":{"ru":"С какой максимальной скоростью бежит сигнал по миелиновым волокнам?","en":"What's the top speed of a signal in myelinated fibres?","ko":"미엘린 섬유에서 신호의 최고 속도는?","ja":"有髄線維での信号の最高速度は？"},"o":[{"ru":"около 1 м/с","en":"about 1 m/s","ko":"초속 약 1m","ja":"約1m/s"},{"ru":"около 10 м/с","en":"about 10 m/s","ko":"초속 약 10m","ja":"約10m/s"},{"ru":"до 120 м/с","en":"up to 120 m/s","ko":"초속 최대 약 120m","ja":"最大約120m/s"},{"ru":"мгновенно","en":"instantly","ko":"즉시","ja":"即時"}],"c":2,"e":{"ru":"В миелинизированных волокнах сигнал достигает 100–120 м/с — в сотни раз быстрее, чем по «голому» аксону.","en":"In myelinated fibres signals reach 100–120 m/s — hundreds of times faster than in bare axons.","ko":"미엘린화된 섬유에서는 100–120m/s에 이르며, 맨 축삭보다 수백 배 빠릅니다.","ja":"有髄線維では100〜120m/sに達し、裸の軸索より数百倍速い。"}},{"q":{"ru":"Что такое синапс?","en":"What is a synapse?","ko":"시냅스란 무엇일까요?","ja":"シナプスとは？"},"o":[{"ru":"Часть черепа","en":"Part of the skull","ko":"두개골의 일부","ja":"頭蓋骨の一部"},{"ru":"Место контакта между нейронами, где передаётся сигнал","en":"Contact point between neurons where the signal passes","ko":"뉴런 간 신호가 전달되는 접점","ja":"ニューロン間で信号が伝わる接点"},{"ru":"Тип нейрона","en":"A neuron type","ko":"뉴런의 한 종류","ja":"ニューロンの一種"},{"ru":"Гормон","en":"A hormone","ko":"호르몬","ja":"ホルモン"}],"c":1,"e":{"ru":"В синапсе сигнал чаще всего передаётся химически — нейромедиаторами, перепрыгивающими микроскопический зазор.","en":"At a synapse the signal usually crosses a microscopic gap chemically — via neurotransmitters.","ko":"시냅스에서는 대부분 신경전달물질이 미세한 틈을 넘어 화학적으로 신호를 전달합니다.","ja":"シナプスでは主に神経伝達物質が微小な隙間を越えて化学的に信号を伝えます。"}},{"q":{"ru":"Какой нейромедиатор связан с мотивацией и вознаграждением?","en":"Which neurotransmitter is tied to motivation and reward?","ko":"동기와 보상과 관련된 신경전달물질은?","ja":"動機づけと報酬に関わる神経伝達物質は？"},"o":[{"ru":"Ацетилхолин","en":"Acetylcholine","ko":"아세틸콜린","ja":"アセチルコリン"},{"ru":"Дофамин","en":"Dopamine","ko":"도파민","ja":"ドーパミン"},{"ru":"ГАМК","en":"GABA","ko":"GABA","ja":"GABA"},{"ru":"Гистамин","en":"Histamine","ko":"히스타민","ja":"ヒスタミン"}],"c":1,"e":{"ru":"Дофамин — ключевой игрок системы вознаграждения: он маркирует «это стоит повторить».","en":"Dopamine is a key player of the reward system — it marks what is worth repeating.","ko":"도파민은 보상 시스템의 핵심입니다. 다시 해볼 가치가 있다고 표시합니다.","ja":"ドーパミンは報酬系の主役で、もう一度やる価値があると印をつけます。"}},{"q":{"ru":"Сколько длится один потенциал действия?","en":"How long does one action potential last?","ko":"하나의 활동전위는 얼마나 지속될까요?","ja":"一つの活動電位はどれくらい続く？"},"o":[{"ru":"Около секунды","en":"About a second","ko":"약 1초","ja":"約1秒"},{"ru":"Около минуты","en":"About a minute","ko":"약 1분","ja":"約1分"},{"ru":"1–2 миллисекунды","en":"1–2 milliseconds","ko":"1–2밀리초","ja":"1〜2ミリ秒"},{"ru":"Час","en":"An hour","ko":"1시간","ja":"1時間"}],"c":2,"e":{"ru":"Потенциал действия — короткий электрический импульс: примерно 1–2 миллисекунды.","en":"An action potential is a brief electric spike — roughly 1–2 milliseconds.","ko":"활동전위는 짧은 전기 스파이크로 약 1–2밀리초입니다.","ja":"活動電位は短い電気スパイクで、約1〜2ミリ秒です。"}},{"q":{"ru":"Что делает миелин?","en":"What does myelin do?","ko":"미엘린은 무엇을 할까요?","ja":"ミエリンは何をする？"},"o":[{"ru":"Разрушает сигнал","en":"Destroys the signal","ko":"신호를 파괴한다","ja":"信号を壊す"},{"ru":"Ускоряет проведение сигнала по аксону","en":"Speeds up conduction along the axon","ko":"축삭을 따라 신호 전도를 빠르게 한다","ja":"軸索に沿った伝導を速める"},{"ru":"Переваривает пищу","en":"Digests food","ko":"음식을 소화한다","ja":"食物を消化する"},{"ru":"Красит мозг","en":"Paints the brain","ko":"뇌를 물들인다","ja":"脳を染める"}],"c":1,"e":{"ru":"Миелин изолирует аксон и заставляет сигнал «прыгать» по перехватам Ранвье — так он ускоряется в разы.","en":"Myelin insulates the axon and makes the signal jump between nodes of Ranvier — many times faster.","ko":"미엘린은 축삭을 절연하고 신호가 Ranvier 결절 사이를 뛰어 가게 해 수배 빨라집니다.","ja":"ミエリンは軸索を絶縁し、信号がランヴィエ絞輪間を跳ぶことで数倍速くなります。"}},{"q":{"ru":"Глимфатическая система мозга — это...","en":"The brain's glymphatic system is...","ko":"글림파 시스템이란?","ja":"グリンパ系とは？"},"o":[{"ru":"Кровеносные сосуды","en":"Blood vessels","ko":"혈관","ja":"血管"},{"ru":"Система очистки мозга от отходов, активная главным образом во сне","en":"A waste-clearance system, most active during sleep","ko":"주로 수면 중 활동하는 뇌의 노폐물 청소 시스템","ja":"主に睡眠中に活動する脳の老廃物除去システム"},{"ru":"Часть иммунитета","en":"Part of immunity","ko":"면역의 일부","ja":"免疫の一部"},{"ru":"Железы","en":"Glands","ko":"샘","ja":"腺"}],"c":1,"e":{"ru":"Открытая в 2012–2013 годах система смывает метаболические отходы спинномозговой жидкостью — особенно во время глубокого сна.","en":"Discovered in 2012–2013, it flushes metabolic waste with cerebrospinal fluid — especially in deep sleep.","ko":"2012–2013년에 발견된 이 시스템은 뇌척수액으로 노폐물을 씻어내며 깊은 수면 중에 특히 활발합니다.","ja":"2012〜2013年に発見されたこの系は脳脊髄液で老廃物を洗い流し、深い睡眠中に特に活発です。"}},{"q":{"ru":"Что принципиально не может ЭЭГ?","en":"What can EEG fundamentally NOT do?","ko":"EEG가 근본적으로 할 수 없는 것은?","ja":"EEGが根本的にできないことは？"},"o":[{"ru":"Поймать ритмы сна","en":"Catch sleep rhythms","ko":"수면 리듬을 포착하다","ja":"睡眠リズムを捉える"},{"ru":"Заметить эпилептическую активность","en":"Detect epileptic activity","ko":"간질 활동을 감지하다","ja":"発作活動を検出する"},{"ru":"Показать реакцию на стимул за миллисекунды","en":"Show millisecond responses to stimuli","ko":"밀리초 단위의 자극 반응을 보여주다","ja":"ミリ秒の刺激反応を示す"},{"ru":"Точно указать источник глубоко в мозге","en":"Precisely locate a deep source","ko":"뇌 깊은 곳의 근원을 정확히 찾다","ja":"脳深部の発生源を正確に特定する"}],"c":3,"e":{"ru":"Сигналы от глубинных структур размываются черепом: ЭЭГ точна по времени, но плоха в «адресации» источника.","en":"Signals from deep structures blur through the skull: EEG is precise in time, poor at locating the source.","ko":"깊은 구조의 신호는 두개골로 흐려집니다. EEG는 시간은 정확하지만 위치 파악은 약합니다.","ja":"深部の信号は頭蓋骨でぼやけます。EEGは時間は正確だが位置特定は苦手です。"}},{"q":{"ru":"Что показал знаменитый пациент Г. М. (Генри Молисон)?","en":"What did the famous patient H. M. (Henry Molaison) show?","ko":"유명한 환자 H. M.(헨리 몰레이슨)은 무엇을 보여주었나요?","ja":"有名な患者H.M.（ヘンリー・モレイソン）が示したことは？"},"o":[{"ru":"Что мозг не важен для памяти","en":"That the brain doesn't matter for memory","ko":"뇌가 기억에 중요하지 않음","ja":"脳は記憶に重要でない"},{"ru":"Что гиппокамп нужен для формирования новых воспоминаний","en":"That the hippocampus is needed to form new memories","ko":"해마가 새 기억 형성에 필요함","ja":"海馬が新しい記憶の形成に必要であること"},{"ru":"Что память живёт в сердце","en":"That memory lives in the heart","ko":"기억은 심장에 있다","ja":"記憶は心臓にある"},{"ru":"Что сон не влияет на память","en":"That sleep doesn't affect memory","ko":"수면은 기억에 영향 없음","ja":"睡眠は記憶に影響しない"}],"c":1,"e":{"ru":"После удаления обоих гиппокампов Г. М. не мог запоминать новые события — но старые воспоминания и моторные навыки частично сохранялись.","en":"After both hippocampi were removed, H. M. couldn't form new memories — while old ones and motor skills partly stayed.","ko":"양쪽 해마를 제거한 뒤 H. M.은 새로운 기억을 만들지 못했지만 오래된 기억과 운동 기술은 부분적으로 남았습니다.","ja":"両側海馬を除去した後、H.M.は新しい記憶を作れなかったが、古い記憶と運動技能は一部残った。"}},{"q":{"ru":"Какой метод показывает, какие области работают «в связке»?","en":"Which method shows which areas work in sync?","ko":"어떤 방법이 영역 간의 연동을 보여줄까요?","ja":"どの方法が領域同士の連動を示す？"},"o":[{"ru":"Рентген","en":"X-ray","ko":"X-ray","ja":"X線"},{"ru":"КТ","en":"CT","ko":"CT","ja":"CT"},{"ru":"фМРТ в покое (resting-state)","en":"Resting-state fMRI","ko":"휴식 상태 fMRI","ja":"安静時fMRI"},{"ru":"Слушание сердца","en":"Listening to the heart","ko":"심장 청진","ja":"心臓の聴診"}],"c":2,"e":{"ru":"В состоянии покоя фМРТ ловит «синхронное дыхание» областей — так строят карты функциональной связности.","en":"At rest, fMRI catches the synchronized breathing of areas — that's how connectivity maps are built.","ko":"휴식 상태 fMRI는 영역들의 동기화된 호흡을 포착하여 기능적 연결 지도를 만듭니다.","ja":"安静時fMRIは領域の同期した呼吸を捉え、機能的結合の地図を作ります。"}},{"q":{"ru":"Нейропластичность — это...","en":"Neuroplasticity is...","ko":"신경 가소성이란?","ja":"神経可塑性とは？"},"o":[{"ru":"Вид пластика","en":"A type of plastic","ko":"일종의 플라스틱","ja":"一種のプラスチック"},{"ru":"Способность мозга менять связи под влиянием опыта","en":"The brain's ability to reshape connections with experience","ko":"경험에 따라 뇌의 연결이 바뀌는 능력","ja":"経験によって脳の結合が変わる能力"},{"ru":"Пластырь для мозга","en":"A brain band-aid","ko":"뇌용 밴드","ja":"脳用の絆創膏"},{"ru":"Форма черепа","en":"A skull shape","ko":"두개골의 형태","ja":"頭蓋の形状"}],"c":1,"e":{"ru":"Мозг перестраивает связи всю жизнь: обучение, практика и даже восстановление после травмы опираются на пластичность.","en":"The brain rewires its connections throughout life — learning, practice and recovery all ride on plasticity.","ko":"뇌는 평생 연결을 다시 만듭니다. 학습, 연습, 회복 모두 가소성에 기반합니다.","ja":"脳は生涯にわたり結合を作り直します。学習・練習・回復はすべて可塑性に基づきます。"}},{"q":{"ru":"Сколько % массы тела занимает мозг, потребляя около 20% энергии?","en":"What % of body mass is the brain that consumes about 20% of energy?","ko":"전체 에너지의 약 20%를 소비하는 뇌는 체중의 몇 %일까요?","ja":"全エネルギーの約20%を使う脳は体重の何%？"},"o":[{"ru":"10%","en":"10%","ko":"10%","ja":"10%"},{"ru":"50%","en":"50%","ko":"50%","ja":"50%"},{"ru":"около 2%","en":"about 2%","ko":"약 2%","ja":"約2%"},{"ru":"20%","en":"20%","ko":"20%","ja":"20%"}],"c":2,"e":{"ru":"Мозг — примерно 2% массы тела, но съедает около 20% всей энергии организма.","en":"The brain is about 2% of body mass yet consumes roughly 20% of the body's energy.","ko":"뇌는 체중의 약 2%지만 신체 에너지의 약 20%를 소비합니다.","ja":"脳は体重の約2%だが、体のエネルギーの約20%を消費します。"}}]});
const DET=[{"ru":"Интересная деталь: лондонские таксисты, годами учившие около 25 000 улиц, показали заметный рост заднего гиппокампа (Maguire et al., 2000) — «скрытых резервов» нет, но мозг растёт под нагрузкой там, где она есть.","en":"Fun detail: London taxi drivers who spent years learning about 25,000 streets showed measurable growth of the posterior hippocampus (Maguire et al., 2000) — no hidden reserves, but the brain does grow where the load is.","ko":"흥미로운 사실: 약 25,000개의 거리를 배운 런던 택시 기사들은 후방 해마의 뚜렷한 성장을 보였습니다(Maguire 등, 2000).","ja":"面白い事実：約25,000の通りを覚えたロンドンのタクシー運転手は、海馬後部の目立った成長を示しました（Maguireら，2000）。"},{"ru":"Интересная деталь: у около 95% правшей речевые центры лежат слева, но и у большинства левшей они тоже слева. Полушария работают в связке, а не «креативное против логики».","en":"Fun detail: in about 95% of right-handers the speech centres sit on the left — yet in most left-handers they are also on the left. The hemispheres work together rather than creative-vs-logical.","ko":"흥미로운 사실: 오른손잡이의 약 95%에서 언어 중심은 왼쪽에 있지만, 대부분의 왼손잡이에서도 왼쪽에 있습니다.","ja":"面白い事実：右利きの約95%で言語中枢は左にありますが、大多数の左利きでも左にあります。"},{"ru":"Интересная деталь: в оригинальном исследовании 1993 года слушали Сонату для двух фортепиано K.448, а эффект был кратким — оживление настроения и внимания на минуты, а не рост IQ.","en":"Fun detail: the 1993 study used the Sonata for Two Pianos K.448, and the effect was brief — a short lift of mood and attention, not an IQ boost.","ko":"흥미로운 사실: 1993년 원 연구에서는 두 대의 피아노를 위한 소나타 K.448을 들었고, 효과는 몇 분간의 기분과 주의 상승에 그쳤습니다.","ja":"面白い事実：1993年の元研究ではピアノソナタK.448を聴き、効果は数分の気分と注意の上昇にとどまりました。"},{"ru":"Интересная деталь: три месяца тренировки жонглирования увеличили серое вещество у взрослых людей со средним возрастом 44 года (Draganski et al., 2004) — пластичность не выключается после 25.","en":"Fun detail: three months of juggling training increased grey matter in adults with an average age of 44 (Draganski et al., 2004) — plasticity doesn't switch off at 25.","ko":"흥미로운 사실: 3개월의 저글링 훈련이 평균 나이 44세 성인의 회백질을 증가시켰습니다(Draganski 등, 2004).","ja":"面白い事実：3ヶ月のジャグリング訓練は平均44歳の成人の灰白質を増やしました（Draganskiら，2004）。"},{"ru":"Интересная деталь: двойное слепое исследование (Wolraich et al., 1995) не нашло разницы между сахаром и аспартам-плацебо — а родители, уверенные, что ребёнок съел сахар, оценивали его возбуждённым даже на плацебо.","en":"Fun detail: a double-blind study (Wolraich et al., 1995) found no difference between sugar and aspartame placebo — and parents who believed the child had sugar rated them hyperactive even on placebo.","ko":"흥미로운 사실: 이중맹검 연구(Wolraich 등, 1995)에서는 설탕과 아스파탐 위약의 차이가 없었습니다. 설탕을 먹었다고 믿은 부모는 위약에서도 흥분했다고 평가했습니다.","ja":"面白い事実：二重盲検研究（Wolraichら，1995）では砂糖とアスパルテーム偽薬の差はありませんでした。"},{"ru":"Интересная деталь: во время глубокого сна глимфатическая система расширяет каналы и промывает мозг спинномозговой жидкостью, вынося метаболические отходы (Xie et al., 2013) — «ночная уборка».","en":"Fun detail: in deep sleep the glymphatic system widens its channels and flushes the brain with cerebrospinal fluid, carrying away metabolic waste (Xie et al., 2013) — a nightly clean-up.","ko":"흥미로운 사실: 깊은 수면 중 글림파 시스템은 채널을 넓히고 뇌척수액으로 뇌를 씻어 노폐물을 제거합니다(Xie 등, 2013).","ja":"面白い事実：深い睡眠中、グリンパ系はチャネルを広げ脳脊髄液で脳を洗浄し老廃物を運び去ります（Xieら，2013）。"},{"ru":"Интересная деталь: левши составляют около 10% людей — и эта доля остаётся стабильной тысячелетиями. В креативности общей разницы не нашли: свои таланты есть у всех.","en":"Fun detail: left-handers make up about 10% of people — a share stable across millennia. No general creativity gap was found: talents exist on both sides.","ko":"흥미로운 사실: 왼손잡이는 약 10%이며, 이 비율은 수천 년간 안정적입니다. 창의성에서 일반적인 차이는 발견되지 않았습니다.","ja":"面白い事実：左利きは約10%で、この割合は数千年にわたり安定しています。"},{"ru":"Интересная деталь: в 1984 году в Джорджии матерям раздавали диски с классикой «для развития новорождённых» — научить спящего малыша не вышло, но запахи и звуки во сне слегка меняют утренние предпочтения (Arzi et al., 2012).","en":"Fun detail: in 1984, mothers in Georgia were handed classical-music discs 'for newborn development' — sleeping babies didn't learn, but smells and sounds during sleep subtly shift morning preferences (Arzi et al., 2012).","ko":"흥미로운 사실: 1984년 조지아에서 신생아 발달용 클래식 음악 디스크가 나눠졌지만, 자는 동안 배움은 증명되지 않았습니다. 다만 수면 중 냄새와 소리가 아침 선호에 약간 영향을 줍니다(Arzi 등, 2012).","ja":"面白い事実：1984年、ジョージアでは新生児発達用クラシック音楽のディスクが配られました。眠っている間の学習は証明されませんでしたが、睡眠中の匂いや音は朝の選好にわずかに影響します（Arziら，2012）。"}];
const OQ2=[{"ru":"Крупные теории — «глобальное рабочее пространство» Бернарда Баарса и «интегрированная информация» Джулио Тонони — объясняют разные части данных, но «трудная проблема» Дэвида Чалмерса остаётся открытой: почему переживание вообще существует?","en":"The big theories — Bernard Baars' global workspace and Giulio Tononi's integrated information — each explain part of the data, but David Chalmers' hard problem remains open: why does experience exist at all?","ko":"버나드 바어스의 「전역 작업 공간」과 줄리오 토노니의 「통합 정보」 이론은 각기 데이터의 일부를 설명하지만, 데이비드 츄머스의 「어려운 문제」는 여전히 열려 있습니다.","ja":"バーナード・バースの「全作業空間」とジュリオ・トノーニの「統合情報」理論はそれぞれデータの一部を説明しますが、デイヴィッド・チャーマーズの「困難な問題」は未解決です。"},{"ru":"Реконсолидация: каждый раз, когда мы вспоминаем, след становится лабильным и перезаписывается. В экспериментах с пропранололом эмоциональный заряд воспоминания ослаблялся — но не стирался полностью.","en":"Reconsolidation: every time we recall, the trace becomes labile and gets rewritten. In propranolol experiments the emotional charge of a memory weakened — but was never fully erased.","ko":"재고정화: 기억할 때마다 흔적은 불안정해지고 다시 기록됩니다. 프로프라놀롤 실험에서 기억의 정서적 전하는 약화되었지만 완전히 지워지지는 않았습니다.","ja":"再固定化：思い出すたびに痕跡は不安定になり、書き直されます。プロプラノロール実験では記憶の感情的負荷は弱まったが完全には消えませんでした。"},{"ru":"Гипотеза активации-синтеза (Хобсон и Маккарли) видит сны как попытку коры осмыслить хаотичные сигналы ствола мозга. Другая линия — сны как ночная эмоциональная тренировка: префронтальная кора приглушена, поэтому абсурд сна мы почти не замечаем.","en":"The activation-synthesis hypothesis (Hobson & McCarley) sees dreams as the cortex trying to make sense of chaotic brainstem signals. Another line: dreams as nightly emotional training — with the prefrontal cortex dimmed, we barely notice the absurdity.","ko":"활성화-합성 가설(Hobson & McCarley)은 꿈을 뇌간의 혼란한 신호를 해석하려는 시도로 봅니다. 또 다른 관점은 꿈을 감정 훈련으로 보는 것입니다.","ja":"活性化-合成仮説（Hobson & McCarley）は夢を脳幹の混沌とした信号を解釈する試みとみなします。"},{"ru":"«Отпечатки» извилин уникальны, как отпечатки пальцев. Близнецовые исследования дают наследуемости интеллекта порядка 50–70% у взрослых — но какие именно гены и как они взаимодействуют со средой, остаётся загадкой.","en":"Cortical folds are as unique as fingerprints. Twin studies put the heritability of intelligence at roughly 50–70% in adults — but which genes and how they interact with environment remains a mystery.","ko":"뇌 고랑의 「지문」은 지문처럼 고유합니다. 쌍둥이 연구는 성인기 지능의 유전율을 50–70%로 추정하지만, 어떤 유전자가 어떻게 환경과 상호작용하는지는 여전히 수수께끼입니다.","ja":"脳溝の「指紋」は指紋のように固有です。双生児研究は成人期の知能の遺伝率を約50〜70%と推定します。"},{"ru":"Сеть P-FIT (paito-frontal integration) связывает IQ со скоростью и эффективностью связей между лобными и теменными областями: важнее не «размер», а то, насколько слаженно области обмениваются сигналами.","en":"The P-FIT (parieto-frontal integration) network links IQ to the speed and efficiency of connections between frontal and parietal areas: what matters is not size but how smoothly areas exchange signals.","ko":"P-FIT(두정-전두 통합) 네트워크는 IQ를 전두엽과 두정엽 사이 연결의 속도와 효율과 연결합니다. 중요한 것은 크기가 아니라 신호 교환의 조화입니다.","ja":"P-FIT（頭頂-前頭統合）ネットワークはIQを前頭葉と頭頂葉の結合の速度と効率に結び付けます。"},{"ru":"Молекулярные «тормоза» Nogo-A ограничивают рост новых связей: блокируя их, учёные заставляли зрительную кору взрослых животных перестраиваться. А белок BDNF — своего рода «удобрение» для нейронов — усиливает пластичность при физической нагрузке.","en":"Molecular brakes like Nogo-A limit the growth of new connections: blocking them made the visual cortex of adult animals reorganise. And the protein BDNF — a kind of fertiliser for neurons — boosts plasticity during exercise.","ko":"분자 「브레이크」인 Nogo-A는 새로운 연결의 성장을 제한합니다. 이를 차단하자 성체 동물의 시각 피질이 재구성되었습니다. 단백질 BDNF는 운동 시 가소성을 높입니다.","ja":"分子の「ブレーキ」Nogo-Aは新しい結合の成長を制限します。これを阻害すると成体の視覚野が再編されました。BDNFは運動時に可塑性を高めます。"}];

  }else{

  const b=dsBestNow();
  $("dsT").textContent=L().dsT;$("dsH").textContent=L().dsH;
  $("dsBox").innerHTML='<button class="btn" onclick="dsGo(\'fwd\')">'+esc(L().dsStart)+'</button> <button class="btn ghost" onclick="dsGo(\'rev\')">'+esc(L().dsStartR)+'</button><p class="hint" style="margin-top:12px">'+esc(L().dsBest)+': '+b.fwd+' / '+b.rev+'</p>';
}
function dsGo(m){dsMode=m;dsLen=3;dsNext();}
function dsNext(){
  dsSeq=[];for(let k=0;k<dsLen;k++)dsSeq.push(Math.floor(Math.random()*10));
  dsOn=true;let i=0;$("dsBox").innerHTML='<div class="dsbig" id="dsDig"></div><p class="hint" style="text-align:center">'+esc(L().dsMem)+(dsMode==='rev'?' ('+esc(L().dsRev)+')':'')+'</p>';
  const iv=setInterval(()=>{if(!dsOn){clearInterval(iv);return;}if(i>=dsLen){clearInterval(iv);dsInput();return;}$("dsDig").textContent=dsSeq[i];i++;},700);
}
function dsInput(){
  $("dsBox").innerHTML='<p class="hint">'+esc(L().dsType)+(dsMode==='rev'?' ('+esc(L().dsRev)+')':'')+'</p><input id="dsIn" class="dsin" autocomplete="off" inputmode="numeric"><br><button class="btn" onclick="dsCheck()">'+esc(L().dsEnter)+'</button>';
  const el=$("dsIn");if(el)el.focus();
}
function dsCheck(){
  const el=$("dsIn");const v=((el&&el.value)||"").replace(/\D/g,"");
  const t=(dsMode==='rev')?dsSeq.slice().reverse().join(""):dsSeq.join("");
  if(v===t){dsLen++;dsNext();return;}
  dsOn=false;const got=dsLen-1;const o=statLoad();o.ds=o.ds||{fwd:0,rev:0};if(got>o.ds[dsMode])o.ds[dsMode]=got;statSave(o);
  $("dsBox").innerHTML='<div class="resb"><div class="big" style="color:var(--acc2)">'+got+'</div><p class="hint">'+esc(L().dsFail)+' '+dsLen+' '+esc(L().stDs)+'</p><button class="btn" onclick="renderDS()">'+esc(L().dsAgain)+'</button></div>';
}
function renderStats(){
  $("stTag").textContent=L().stTag;$("stTitle").textContent=L().stTitle;$("stDemo").textContent=L().stDemo;
  const nQ=QUIZZES.reduce((a,q)=>a+q.q.length,0);
  const cells=[[QUIZZES.length,L().nQz],[nQ,L().nQ],[3,L().nCog],[MYTHS.length,L().nMy]];
  $("statGrid").innerHTML=cells.map(c=>'<div class="s1"><div class="n">'+c[0]+'</div><div class="l">'+esc(c[1])+'</div></div>').join("");
  const o=statLoad(),rows=[];
  Object.keys(o.quiz||{}).forEach(id=>{const q=QUIZZES.find(x=>x.id===id);if(q&&(o.quiz[id]||[]).length){const best=Math.max.apply(null,o.quiz[id].map(r=>r.pct));rows.push([tx(q.title),best+"%",best]);}});
  if((o.stroop||[]).length){const l=o.stroop[o.stroop.length-1];rows.push([L().stLq,l.avg+" "+L().stMs,Math.min(100,Math.round(l.avg/12))]);}
  const b=o.ds||{fwd:0,rev:0};
  if(b.fwd||b.rev){rows.push([L().stLd,b.fwd+" / "+b.rev+" "+L().stDs,Math.min(100,Math.round(Math.max(b.fwd,b.rev)*100/12))]);}
  $("dbar").innerHTML=rows.length?rows.map(r=>'<div class="row"><div class="lab"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div><div class="tr"><div class="fl" style="width:'+r[2]+'%"></div></div></div>').join(""):'<p class="hint">'+esc(L().stNone)+'</p>';
}
function startNeuro(){
  const cv=$("neuroCv");if(!cv||!cv.getContext)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const ctx=cv.getContext("2d");let W=0,H=0,N=[],raf=null,vis=true;
  function rs(){W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight;
    const n=Math.min(46,Math.round(W*H/9000));N=[];for(let k=0;k<n;k++)N.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3});}
  rs();window.addEventListener("resize",rs);
  document.addEventListener("visibilitychange",()=>{vis=!document.hidden;if(vis&&!raf)loop();});
  function step(){for(let k=0;k<N.length;k++){const p=N[k];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;}}
  function draw(){ctx.clearRect(0,0,W,H);
    for(let i=0;i<N.length;i++){const a=N[i];ctx.beginPath();ctx.arc(a.x,a.y,1.6,0,6.283);ctx.fillStyle="rgba(139,124,246,0.8)";ctx.fill();
      for(let j=i+1;j<N.length;j++){const b2=N[j],dx=a.x-b2.x,dy=a.y-b2.y,d2=dx*dx+dy*dy;
        if(d2<9000){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b2.x,b2.y);ctx.strokeStyle="rgba(90,209,200,"+(0.25*(1-d2/9000)).toFixed(3)+")";ctx.stroke();}}}}
  function loop(){if(!vis)return;step();draw();raf=requestAnimationFrame(loop);}
  loop();
}
startNeuro();
function renderAll(){buildNav();renderHome();renderQuizzes();renderLib();renderOpenQ();renderLab();renderStats();renderRest();}
buildLangs();renderAll();
</script>
