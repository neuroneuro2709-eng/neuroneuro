<style>

header{padding:120px 0 60px;text-align:center}
.kick{color:var(--acc2);text-transform:uppercase;letter-spacing:3px;font-size:12px;font-weight:700}

.sub{color:var(--mut);max-width:640px;margin:0 auto;font-size:17px}
.disc{color:var(--mut);font-size:13px;margin-top:22px;opacity:.8}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}
.card h3{margin-bottom:10px;font-size:19px}
.card p{color:var(--mut);font-size:14px}
.card .go{display:inline-block;margin-top:14px;color:var(--acc);font-weight:600;cursor:pointer}
section{padding:64px 0;border-top:1px solid var(--line)}
.tag{color:var(--acc2);text-transform:uppercase;letter-spacing:2.5px;font-size:11px;font-weight:700}

.secs{color:var(--mut);max-width:700px;margin-bottom:32px}
.btn{background:var(--acc);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}

.qcard .ic{font-size:30px}

.qbox{background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:26px;margin-top:24px}
.qtop{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:14px}
.tl{font-weight:700;color:var(--acc2)}
.qtext{font-size:20px;font-weight:700;margin-bottom:18px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:13px 16px;font-size:15px;margin-bottom:10px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:rgba(90,209,124,.12)}
.opt.bad{border-color:var(--bad);background:rgba(224,85,106,.12)}

.expl{background:var(--card2);border-left:3px solid var(--acc2);border-radius:10px;padding:14px 16px;font-size:14px;color:var(--tx);margin:8px 0 16px}
.resb{text-align:center;padding:10px 0}
.resb .big{font-size:46px;font-weight:800;color:var(--acc)}
.acard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;transition:.2s}
.acard:hover{transform:translateY(-3px);border-color:var(--acc)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:3px 12px;margin-bottom:12px}
.b-ok{background:rgba(90,209,124,.15);color:var(--ok)}
.b-mid{background:rgba(255,193,7,.15);color:#ffc107}
.b-no{background:rgba(224,85,106,.15);color:var(--bad)}
.acard h4{font-size:16px;margin-bottom:8px}
.acard p{color:var(--mut);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal.on{display:flex}
.mbox{background:var(--card2);border:1px solid var(--line);border-radius:18px;max-width:680px;width:100%;padding:30px;position:relative}
.mclose{position:absolute;top:14px;right:14px;background:var(--card);border:1px solid var(--line);color:var(--tx);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}

.acc .num{color:var(--acc2);font-weight:800;font-size:14px;padding-top:2px}
.acc .hd h4{font-size:16px;font-weight:700}
.acc .bd{display:none;padding:0 20px 18px 20px;color:var(--mut);font-size:14px}
.acc.open .bd{display:block}
.acc.open .hd{border-bottom:1px solid var(--line)}
.unk{background:var(--card2);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13.5px}
.unk b{color:var(--acc2)}
.labgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.panel h4{font-size:17px;margin-bottom:10px}
.panel .hint{color:var(--mut);font-size:13px;margin-bottom:14px}
.brainsvg{width:100%;height:auto}
.dot{cursor:pointer;transition:.2s}
.dot:hover{filter:brightness(1.4)}
.binfo{background:var(--card2);border-radius:12px;padding:14px 16px;font-size:14px;min-height:76px;margin-top:12px}
.stroop{display:flex;flex-direction:column;gap:12px;align-items:center}
.stword{font-size:44px;font-weight:800;padding:10px 0}
.sbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sbtn{border:1px solid var(--line);background:var(--card2);color:#fff;border-radius:10px;padding:10px 18px;cursor:pointer;font-size:14px;font-weight:600}
.stat{display:flex;flex-wrap:wrap;gap:14px}
.stat .s1{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;flex:1;min-width:150px;text-align:center}
.stat .n{font-size:38px;font-weight:800;color:var(--acc)}
.stat .l{color:var(--mut);font-size:13px}
.dbar{margin-top:26px}
.dbar .row{margin-bottom:12px}
.dbar .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:5px}
.dbar .tr{height:8px;background:var(--card2);border-radius:6px;overflow:hidden}
.dbar .fl{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.rcard .num{color:var(--acc2);font-size:12px;font-weight:700;letter-spacing:1px}
.rcard h4{margin:8px 0}
.rcard p{color:var(--mut);font-size:14px}
.rcard .src{margin-top:12px;font-size:12px;color:var(--acc2)}
.meth{margin-top:24px;color:var(--mut);font-size:13px;border-left:3px solid var(--acc);padding-left:14px}
.univ{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.univ .u{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.univ .c{color:var(--acc2);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.univ h4{margin:6px 0}
.univ p{color:var(--mut);font-size:13px}
.colnote{margin-top:22px;background:var(--card2);border-radius:12px;padding:16px 18px;font-size:14px;color:var(--mut)}
.stagegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stage .st{color:var(--acc2);font-size:11px;font-weight:800;letter-spacing:2px}
.stage p{color:var(--mut);font-size:13px;margin-top:6px}
.svrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.svbtns{display:flex;gap:6px;flex-shrink:0}
.svb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer;font-size:12px;font-weight:700}
.svb.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.bar3{margin-top:16px}
.bar3 .row{margin-bottom:14px}
.bar3 .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar3 .tr{height:10px;background:var(--card2);border-radius:8px;overflow:hidden}
.bar3 .fl{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
footer{padding:50px 0 40px;border-top:1px solid var(--line);text-align:center}

.ftbtns{display:flex;gap:12px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.fine{color:var(--mut);font-size:12px;margin-top:26px;opacity:.8}

</style>

<script>const UI={"ru":{"nav":["Главная","Квизы","Библиотека","Открытые вопросы","Лаборатория","Статистика","Мои исследования","Сотрудничество","Обо мне"],"kick":"Исследуем мозг человека","title":"Узнайте, как работает ваш мозг","sub":"Нейронаука простым языком. Исследования, эксперименты и интерактивное изучение человеческого мозга.","disc":"Художественная визуализация, а не симуляция реальной нейронной активности.","c":[{"t":"Проверить знания","x":"Квизы по нейроанатомии, нейровизуализации, памяти и другим темам.","b":"К квизам →"},{"t":"Узнать себя","x":"Научно-популярные опросники о сне, привычках и когнитивном опыте.","b":"К опросникам →"},{"t":"Разрушить мифы","x":"Разбор популярных заблуждений о мозге с научными источниками.","b":"К статьям →"}],"qzTag":"01 · Знания","qzTitle":"Каталог квизов","qzSub":"Пять квизов: таймер 30 секунд и объяснение после каждого вопроса.","libTag":"02 · Библиотека","libTitle":"Статьи и разборы","libSub":"Каждая публикация: утверждение → что говорит наука → источник.","oqTag":"03 · Границы знаний","oqTitle":"Чего мы пока не знаем","oqIntro":"Мозг — одна из самых сложных систем, которые когда-либо пыталось изучить человечество. Мы знаем, как нейроны передают сигналы и как формируются воспоминания. Но понимание отдельных механизмов ещё не означает, что мы понимаем систему целиком. Этот раздел — о границах современных знаний.","oqWhy":"Почему эти вопросы важны","oqWhy1":"Незнание — не признак неудачи науки. Это обозначение границы между тем, что подтверждено исследованиями, и тем, что ещё предстоит выяснить.","oqWhy2":"Каждый нерешённый вопрос — возможность для нового эксперимента, пересмотра теории или обнаружения механизма, о котором раньше не подозревали.","oqSlogan":"Исследуем известное. Ставим под вопрос неизвестное.","labTag":"04 · Лаборатория","labTitle":"Интерактивная лаборатория","labSub":"Brain Explorer, эксперимент Струпа и опросник «Узнать себя» — инструменты без правильных ответов, с честными ограничениями интерпретации.","beT":"🧠 Brain Explorer","beH":"Нажмите на область, чтобы узнать, за что она отвечает. Стилизованная схема, не анатомическая карта.","beDef":"Выберите область мозга.","stT":"🎨 Эксперимент Струпа","stH":"Слово обозначает цвет, но написано другим. Нажимайте кнопку цвета шрифта, преодолевая автоматическое чтение. 10 раундов на скорость.","stStart":"Начать эксперимент","stRound":"Раунд","stAgain":"Ещё раз","stAvg":"Среднее время","stAcc":"Точность","stDone":"Готово!","svT":"📋 Опросник «Узнать себя»","svH":"10 утверждений о сне, стрессе и цифровой усталости. Это образовательный самоотчёт, а не медицинская диагностика.","svBtn":"Рассчитать когнитивный профиль","svTitle":"Ваш профиль","svNote":"Пирог: «усталость» — ниже лучше; «сон» и «внимание» — выше лучше. Оценки примерные.","sc":["Совсем нет","Скорее нет","Средне","Скорее да","Полностью да"],"scS":"Сон и режим","scA":"Внимание","scF":"Усталость","stTag":"05 · Цифры","stTitle":"Проект в цифрах","stDemo":"Средние результаты по квизам (демо-данные — реальные появятся после подключения сбора статистики):","nQz":"тем квизов","nQ":"вопросов с объяснениями","nCog":"когнитивных эксперимента","nMy":"научных разборов","rsTag":"06 · Портфолио","rsTitle":"Мои исследования","rsSub":"Учебные проекты, методология и честные ограничения методов — ядро академического портфолио.","meth":"Методология. Тесты и опросники разработаны на основе учебников Purves «Neuroscience», Bear «Neuroscience: Exploring the Brain» и Huettel «Brain Imaging». Дисклеймер: проект не является медицинским инструментом и не заменяет консультацию врача.","clTag":"07 · Сотрудничество","clTitle":"Открыта к сотрудничеству","clSub":"Соединяю любопытство и нейронауку: научная коммуникация, интерактивное обучение, учебные исследования.","clNote":"Важно: статус проекта — «Open to collaboration», а не «In collaboration with»: реальных соглашений пока нет, и я считаю, что честность здесь важнее солидности. Для академических запросов — neuroneuro26@gmail.com.","abTag":"08 · Обо мне","abTitle":"Обо мне","ab1":"Меня зовут София Беркутова. neuroneuro начался с простого вопроса: почему мы думаем, чувствуем и поступаем именно так — и почему об этом так мало честных, доступных объяснений?","ab2":"Этот проект — мой способ разобраться самому и поделиться: я перевожу нейронауку с языка исследований на понятный язык, без упрощений до потери смысла и без стен из терминов. Мои академические интересы — нейробиология, когнитивная наука и нейровизуализация; целевая цель — направление Brain and Cognitive Sciences в KAIST.","ab3":"Проект — не витрина, а тренировочная площадка: каждый квиз, эксперимент и статья — это и контент, и инженерная работа, и тренировка научной коммуникации.","stages":[["ЭТАП 1","Главная страница, навигация, три направления, перенос квиза."],["ЭТАП 2","Интерактивность: Brain Explorer, опросники, эксперимент Струпа, нейрофакт дня."],["ЭТАП 3","Научное портфолио: статьи, библиотека источников, методология, открытая статистика."],["ДАЛЬШЕ","Сбор реальных данных, новые квизы, новые эксперименты."]],"ftT":"Есть вопрос или идея?","ftX":"Я читаю все сообщения и рада обсудить нейронауку, идеи для новых квизов или сотрудничество.","ftTg":"Telegram-канал","ftF":"neuroneuro — независимый образовательный проект. Материалы и опросники носят научно-популярный характер, не являются медицинским инструментом и не заменяют консультацию врача.","ftC":"Created by SOFIIA BERKUTOVA","correct":"Верно!","wrong":"Не совсем","next":"Далее","again":"Пройти ещё раз","score":"Ваш результат","qof":"Вопрос","open":"Открыть","timeOut":"Время вышло","close":"Закрыть","lock":"Скоро","ready":"Готов","mini":"Мини","soon":"Скоро","demo":"демо","claim":"Утверждение","science":"Что говорит наука","srcL":"Источник","unkTitle":"Что мы пока не знаем:"},"en":{"nav":["Home","Quizzes","Library","Open questions","Lab","Stats","Research","Collaboration","About"],"kick":"Exploring the human brain","title":"Learn how your brain works","sub":"Neuroscience in plain language. Research, experiments and interactive exploration of the human brain.","disc":"Artistic visualization, not a simulation of real neural activity.","c":[{"t":"Test your knowledge","x":"Quizzes on neuroanatomy, neuroimaging, memory and more.","b":"To the quizzes →"},{"t":"Discover yourself","x":"Popular-science questionnaires about sleep, habits and cognitive experience.","b":"To the questionnaires →"},{"t":"Bust the myths","x":"Popular brain myths examined with scientific sources.","b":"To the articles →"}],"qzTag":"01 · Knowledge","qzTitle":"Quiz catalog","qzSub":"Five quizzes: a 30-second timer and an explanation after every question.","libTag":"02 · Library","libTitle":"Articles and reviews","libSub":"Every piece: a claim → what science says → the source.","oqTag":"03 · Frontiers","oqTitle":"What we don't know yet","oqIntro":"The brain is one of the most complex systems humanity has ever tried to study. We know how neurons transmit signals and how memories form. Yet understanding single mechanisms does not mean understanding the whole system. This section is about the limits of modern knowledge.","oqWhy":"Why these questions matter","oqWhy1":"Not knowing is not a failure of science. It marks the border between what research has confirmed and what remains to be found out.","oqWhy2":"Every open question is a chance for a new experiment, a revised theory, or a mechanism nobody suspected.","oqSlogan":"We explore the known. We question the unknown.","labTag":"04 · Lab","labTitle":"Interactive lab","labSub":"Brain Explorer, the Stroop task and the self-discovery questionnaire — tools with no right answers and honest limits of interpretation.","beT":"🧠 Brain Explorer","beH":"Tap an area to see what it does. A stylized scheme, not an anatomical map.","beDef":"Select a brain area.","stT":"🎨 The Stroop task","stH":"The word names one color but is printed in another. Tap the button matching the font color, fighting the urge to read. 10 rounds for speed.","stStart":"Start","stRound":"Round","stAgain":"Again","stAvg":"Average time","stAcc":"Accuracy","stDone":"Done!","svT":"📋 Self-discovery questionnaire","svH":"10 statements about sleep, stress and digital fatigue. An educational self-report, not medical diagnosis.","svBtn":"Calculate my cognitive profile","svTitle":"Your profile","svNote":"Note: lower «fatigue» is better; higher «sleep» and «attention» are better. Rough estimates only.","sc":["Not at all","Rather no","Neutral","Rather yes","Fully yes"],"scS":"Sleep & routine","scA":"Attention","scF":"Fatigue","stTag":"05 · Numbers","stTitle":"The project in numbers","stDemo":"Average quiz results (demo data — real numbers will appear once analytics is connected):","nQz":"quiz topics","nQ":"questions with explanations","nCog":"cognitive experiments","nMy":"science reviews","rsTag":"06 · Portfolio","rsTitle":"My research","rsSub":"Course projects, methodology and honest limitations — the core of an academic portfolio.","meth":"Methodology. The tests are based on Purves' «Neuroscience», Bear's «Neuroscience: Exploring the Brain» and Huettel's «Brain Imaging». Disclaimer: this project is not a medical tool and does not replace a doctor's consultation.","clTag":"07 · Collaboration","clTitle":"Open to collaboration","clSub":"Combining curiosity and neuroscience: science communication, interactive learning, course research.","clNote":"Note: the project status is «Open to collaboration», not «In collaboration with» — there are no real agreements yet, and I believe honesty matters more than looks. Academic inquiries: neuroneuro26@gmail.com.","abTag":"08 · About","abTitle":"About me","ab1":"My name is Sofiia Berkutova. neuroneuro began with a simple question: why do we think, feel and act this way — and why are there so few honest, accessible explanations?","ab2":"This project is my way to understand and share: translating neuroscience from the language of papers into plain language, without dumbing it down or hiding behind jargon. My academic interests are neurobiology, cognitive science and neuroimaging; my target goal is Brain and Cognitive Sciences at KAIST.","ab3":"The project is not a showcase but a training ground: every quiz, experiment and article is content, engineering work and practice in science communication.","stages":[["STAGE 1","Landing page, navigation, three directions, quiz migration."],["STAGE 2","Interactivity: Brain Explorer, questionnaires, the Stroop task, a daily neurofact."],["STAGE 3","Science portfolio: articles, source library, methodology, open stats."],["NEXT","Real data collection, new quizzes, new experiments."]],"ftT":"Have a question or idea?","ftX":"I read every message and am happy to discuss neuroscience, ideas for new quizzes or collaboration.","ftTg":"Telegram channel","ftF":"neuroneuro is an independent educational project. Materials and questionnaires are popular-science in nature, are not a medical tool and do not replace a doctor's consultation.","ftC":"Created by SOFIIA BERKUTOVA","correct":"Correct!","wrong":"Not quite","next":"Next","again":"Try again","score":"Your result","qof":"Question","open":"Open","timeOut":"Time's up","close":"Close","lock":"Soon","ready":"Ready","mini":"Mini","soon":"Soon","demo":"demo","claim":"The claim","science":"What science says","srcL":"Source","unkTitle":"What we don't know yet:"},"ko":{"nav":["홈","퀴즈","라이브러리","열린 질문","실험실","통계","나의 연구","협업","소개"],"kick":"인간의 뇌를 탐구하다","title":"당신의 뇌가 어떻게 작동하는지 알아보세요","sub":"신경과학을 쉬운 언어로. 연구, 실험, 인간의 뇌에 대한 인터랙티브 탐구.","disc":"실제 신경 활동의 시뮬레이션이 아닌 예술적 시각화입니다.","c":[{"t":"지식 확인하기","x":"신경해부학, 뇌영상, 기억 등의 퀴즈.","b":"퀴즈로 →"},{"t":"나를 알아가기","x":"수면, 습관, 인지 경험에 대한 과학 설문.","b":"설문으로 →"},{"t":"미신 깨기","x":"과학적 출처와 함께 검증하는 뇌 미신.","b":"기사로 →"}],"qzTag":"01 · 지식","qzTitle":"퀴즈 카탈로그","qzSub":"다섯 개의 퀴즈: 30초 타이머, 각 문제 뒤 해설.","libTag":"02 · 라이브러리","libTitle":"기사와 해설","libSub":"각 기사: 주장 → 과학이 말하는 것 → 출처.","oqTag":"03 · 지식의 경계","oqTitle":"우리가 아직 모르는 것","oqIntro":"뇌는 인류가 연구하려 한 가장 복잡한 체계 중 하나입니다. 우리는 뉴런이 신호를 전달하는 방식과  과학 커뮤니케이션 연습입니다.","stages":[["단계 1","메인 페이지, 내비게이션, 세 방향, 퀴즈 이식."],["단계 2","인터랙티브: Brain Explorer, 설문, 스트룹 실험, 데일리 뉴로팩트."],["단계 3","학술 포트폴리오: 기사, 출처 라이브러리, 방법론, 공개 통계."],["다음","실제 데이터 수집, 새 퀴즈, 새 실험."]],"ftT":"질문이나 아이디어가 있나요?","ftX":"모든 메시지를 읽고 있습니다. 신경과학, 새 퀴즈 아이디어, 협업에 대해 기꺼이 이야기합니다.","ftTg":"텔레그램 채널","ftF":"neuroneuro는 독립 교육 프로젝트입니다. 자료와 설문은 과학 대중서 성격이며 의료 도구가 아니고 의사의 진료를 대체하지 않습니다.","ftC":"Created by SOFIIA BERKUTOVA","correct":"정답!","wrong":"아쉽네요","next":"다음","again":"다시 도전","score":"나의 결과","qof":"문제","open":"열기","timeOut":"시간 초과","close":"닫기","lock":"준비 중","ready":"완료","mini":"미니","soon":"준비 중","demo":"데모","claim":"주장","science":"과학이 말하는 것","srcL":"출처","unkTitle":"우리가 아직 모르는 것:"},"ja":{"nav":["ホーム","クイズ","図書館","未解決の問い","ラボ","統計","私の研究","連携","私について"],"kick":"人間の脳を探求する","title":"あなたの脳のしくみを知る","sub":"神経科学をわかりやすい言葉で。研究、実験、人間の脳のインタラクティブな探究。","disc":"実際の神経活動のシミュレーションではなく、芸術的な視覚化です。","c":[{"t":"知識を試す","x":"神経解剖学、脳イメージング、記憶などのクイズ。","b":"クイズへ →"},{"t":"自分を知る","x":"睡眠、習慣、認知に関する科学アンケート。","b":"アンケートへ →"},{"t":"神話を解く","x":"科学的な出典とともに脳の神話を検証。","b":"記事へ →"}],"qzTag":"01 · 知識","qzTitle":"クイズカタログ","qzSub":"5つのクイズ：30秒のタイマーと各問題の解説付き。","libTag":"02 · 図書館","libTitle":"記事と解説","libSub":"各記事：主張 → 科学が語ること → 出典。","oqTag":"03 · 知識の限界","oqTitle":"まだ分かっていないこと","oqIntro":"脳は人類が研究してきた最も複雑な系の一つです。ニューロンが信号を伝える仕組みや記憶が形成される仕組みは分かっています。しかし個々のメカニズムの理解は、系全体の理解を意味しません。このセクションは現代の知識の限界についてです。","oqWhy":"なぜこの問いが重要か","oqWhy1":"分からないことは科学の失敗ではありません。研究で確認されたことと、これから明らかにすべきことの境界を示すものです。","oqWhy2":"解けない問いの一つ一つが、新しい実験、理論の見直し、予想外のメカニズムの発見の機会です。","oqSlogan":"既知を探求し、未知を問う。","labTag":"04 · ラボ","labTitle":"インタラクティブラボ","labSub":"Brain Explorer、ストループ課題、自己理解アンケート — 正解のない道具で、解釈の限界も正直に。","beT":"🧠 Brain Explorer","beH":"領域をタップして役割を確認。概念的な図で、解剖図ではありません。","beDef":"脳領域を選択してください。","stT":"🎨 ストループ課題","stH":"単語の意味と文字色が異なります。文字色のボタンを押してください。自動読みに逆らう10ラウンドの速度測定。","stStart":"実験開始","stRound":"ラウンド","stAgain":"もう一度","stAvg":"平均時間","stAcc":"正確さ","stDone":"完了！","svT":"📋 自己理解アンケート","svH":"睡眠、ストレス、デジタル疲労に関する10項目。教育目的の自己評価であり、医学的診断では const QUIZZES=[{"id":"main","icon":"🧠","title":{"ru":"Как работает мозг","en":"How the brain works","ko":"뇌는 어떻게 작동하는가","ja":"脳のしくみ"},"desc":{"ru":"Базовый квиз о нейронах, синапсах и главном.","en":"A starter quiz on neurons, synapses and the essentials.","ko":"뉴런, 시냅스, 기본 개념 퀴즈.","ja":"ニューロン、シナプス、基本をめぐるクイズ。"},"q":[{"q":{"ru":"Сколько примерно нейронов в мозге человека?","en":"Roughly how many neurons are in the human brain?","ko":"인간 뇌에는 대략 몇 개의 뉴런이 있나요?","ja":"ヒトの脳にはおよそ何個のニューロンがありますか？"},"o":[{"ru":"860 млн","en":"860 million","ko":"8600만","ja":"860万"},{"ru":"86 млн","en":"86 million","ko":"8600만","ja":"8600万"},{"ru":"86 млрд","en":"86 billion","ko":"860억","ja":"860億"},{"ru":"860 млрд","en":"860 billion","ko":"8600억","ja":"8600億"}],"c":2,"e":{"ru":"Около 86 миллиардов нейронов — оценку получил пауловский подсчёт Алина Херкулано-Хоузел с командой в 2009 году.","en":"About 86 billion neurons — the estimate came from Suzana Herculano-Houzel and colleagues in 2009.","ko":"약 860억 개. 수잔나 에르쿨라노-하우젤 팀이 2009년에 제시한 추정치입니다.","ja":"約860億個。2009年にヘルクラノ＝ウーゼルらが示した推定値です。"}},{"q":{"ru":"Какая структура критична для формирования новых долгосрочных воспоминаний?","en":"Which structure is critical for forming new long-term memories?","ko":"새로운 장기 기억 형성에 핵심인 구조는?","ja":"新しい長期記憶の形成に不可欠な構造は？"},"o":[{"ru":"Мозжечок","en":"Cerebellum","ko":"소뇌","ja":"小脳"},{"ru":"Гиппокамп","en":"Hippocampus","ko":"해마","ja":"海馬"},{"ru":"Спинной мозг","en":"Spinal cord","ko":"척수","ja":"脊髄"},{"ru":"Ствол мозга","en":"Brainstem","ko":"뇌간","ja":"脳幹"}],"c":1,"e":{"ru":"Гиппокамп — ключевой узел консолидации: без него новые эпизоды не закрепляются в долговременную память.","en":"The hippocampus is the key consolidation hub: without it new episodes do not get stored in long-term memory.","ko":"해마는 정보 통합의 핵심으로, 이것이 없으면 새로운 에피소드가 장기 기억으로 저장되지 않습니다.","ja":"海馬は情報固定の中核で、これがないと新しい出来事は長期記憶に保存されません。"}},{"q":{"ru":"Что такое синапс?","en":"What is a synapse?","ko":"시냅스란?","ja":"シナプスとは？"},"o":[{"ru":"Ядро нейрона","en":"The nucleus of a neuron","ko":"뉴런의 핵","ja":"ニューロンの核"},{"ru":"Контакт между нейронами для передачи сигнала","en":"A contact between neurons that passes signals","ko":"신호를 전달하는 뉴런 간 접점","ja":"ニューロン間で信号を伝える接点"},{"ru":"Мембрана клетки","en":"The cell membrane","ko":"세포막","ja":"細胞膜"},{"ru":"Тип глиальной клетки","en":"A type of glial cell","ko":"일종의 신경교세포","ja":"グリア細胞の一種"}],"c":1,"e":{"ru":"Синапс — место связи нейронов: сигнал передаётся химически (нейромедиаторами) или электрически.","en":"A synapse is the junction between neurons: the signal passes chemically (via neurotransmitters) or electrically.","ko":"시냅스는 뉴런 사이 연결 지점으로, 신경전달물질(화학) 또는 전기적으로 신호가 전달됩니다.","ja":"シナプスはニューロン間の接合部で、神経伝達物質（化学的）または電気的に信号が伝わります。"}},{"q":{"ru":"Какой нейромедиатор в первую очередь связан с удовольствием и мотивацией?","en":"Which neurotransmitter is primarily linked to pleasure and motivation?","ko":"쾌락과 동기와 가장 관련된 신경전달물질은?","ja":"快楽と動機に主に関わる神経伝達物質は？"},"o":[{"ru":"Серин","en":"Serine","ko":"세린","ja":"セリン"},{"ru":"Гистамин","en":"Histamine","ko":"히스타민","ja":"ヒスタミン"},{"ru":"Дофамин","en":"Dopamine","ko":"도파민","ja":"ドーパミン"},{"ru":"Таурин","en":"Taurine","ko":"타우린","ja":"タウリン"}],"c":2,"e":{"ru":"Дофамин — это скорее нейромедиатор мотивации и обучения, чем «гормон удовольствия» в чистом виде.","en":"Dopamine is more a neurotransmitter of motivation and learning than a pure «pleasure hormone».","ko":"도파민은 순수한 「쾌락 호르몬」이라기보다 동기와 학습의 신경전달물질에 가깝습니다.","ja":"ドーパミンは純粋な「快楽ホルモン」というより、動機づけと学習に関わる伝達物質です。"}},{"q":{"ru":"Что делает миелиновая оболочка?","en":"What does the myelin sheath do?","ko":"미엘린(수초)의 역할은?","ja":"ミエリン鞘の役割は？"},"o":[{"ru":"Синтезирует нейромедиаторы","en":"Synthesizes neurotransmitters","ko":"신경전달물질 합성","ja":"神経伝達物質の合成"},{"ru":"Ускоряет проведение импульса по аксону","en":"Speeds up impulse conduction along the axon","ko":"축삭 신호 전도를 가속","ja":"軸索の信号伝導を速める"},{"ru":"Разрушает отработанные синапсы","en":"Destroys spent synapses","ko":"낡은 시냅스를 파괴","ja":"古いシナプスを破壊"},{"ru":"Хранит глюкозу","en":"Stores glucose","ko":"포도당 저장","ja":"グルコースを貯蔵"}],"c":1,"e":{"ru":"Миелин — «изоляция» аксона: сигнал перескакивает по перехватам Ранвье и движется в разы быстрее.","en":"Myelin is the axon's insulation: the signal jumps along nodes of Ranvier and moves many times faster.","ko":"미엘린은 축삭의 「절연체」로, 신호가 랑비에 절편을 뛰어넘어 수배 빠르게 이동합니다.","ja":"ミエリンは軸索の絶縁体で、信号はランビエ絞輪を跳び越え、数倍速く進みます。"}},{"q":{"ru":"Какая доля кислорода, потребляемого телом в покое, приходится на мозг?","en":"What share of the body's oxygen at rest does the brain use?","ko":"휴식 시 몸이 소비하는 산소 중 뇌가 차지하는 비율은?","ja":"安静時に体が消費する酸素のうち脳が占める割合は？"},"o":[{"ru":"около 5%","en":"about 5%","ko":"약 5%","ja":"約5%"},{"ru":"около 20%","en":"about 20%","ko":"약 20%","ja":"約20%"},{"ru":"около 50%","en":"about 50%","ko":"약 50%","ja":"約50%"},{"ru":"около 80%","en":"about 80%","ko":"약 80%","ja":"約80%"}],"c":1,"e":{"ru":"Мозг весит около 2% массы тела, но потребляет примерно 20% кислорода и глюкозы.","en":"The brain is about 2% of body mass but consumes roughly 20% of oxygen and glucose.","ko":"뇌는 체중의 약 2%지만 산소와 포도당의 약 20%를 소비합니다.","ja":"脳は体重の約2%だが、酸素とグルコースの約20%を消費します。"}},{"q":{"ru":"Что такое нейропластичность?","en":"What is neuroplasticity?","ko":"신경가소성이란?","ja":"神経可塑性とは？"},"o":[{"ru":"Способность мозга менять связи в ответ на опыт","en":"The brain's ability to change connections in response to experience","ko":"경험에 따라 연결을 바꾸는 뇌의 능력","ja":"経験に応じて結合を変える脳の能力"},{"ru":"Уменьшение числа нейронов с возрастом","en":"The decrease of neuron count with age","ko":"나이에 따른 뉴런 수 감소","ja":"加齢によるニューロン数の減少"},{"ru":"Неизменность мозга после 25 лет","en":"The brain's unchangeability after age 25","ko":"25세 이후 뇌의 불변성","ja":"25歳以降の脳の不変性"},{"ru":"Способность делить клетки","en":"The ability to divide cells","ko":"세포 분열 능력","ja":"細胞分裂の能力"}],"c":0,"e":{"ru":"Пластичность — основа обучения: синапсы усиливаются или ослабляются, и связи перестраиваются всю жизнь.","en":"Plasticity underlies learning: synapses strengthen or weaken, and connections rewire throughout life.","ko":"가소성은 학습의 기반입니다. 시냅스가 강해지거나 약해지며 연결은 평생 재편됩니다.","ja":"可塑性は学習の基盤です。シナプスが強まったり弱まったりし、結合は生涯再編されます。"}}]},{"id":"meth","icon":"🔬","title":{"ru":"Методы нейровизуализации","en":"Neuroimaging methods","ko":"뇌영상 방법","ja":"脳イメージング法"},"desc":{"ru":"Как заглядывают внутрь живого мозга.","en":"How researchers peer into a living brain.","ko":"살아있는 뇌를 들여다보는 방법.","ja":"生きている脳を覗く方法。"},"q":[{"q":{"ru":"Что измеряет фМРТ?","en":"What does fMRI measure?","ko":"fMRI는 무엇을 측정하나요?","ja":"fMRIは何を測定しますか？"},"o":[{"ru":"Электрические волны мозга","en":"Brain electric waves","ko":"뇌의 전기파","ja":"脳の電気的波"},{"ru":"Изменения кровотока как косвенный признак активности","en":"Blood-flow changes as an indirect sign of activity","ko":"활동의 간접 지표인 혈류 변화","ja":"活動の間接指標である血流変化"},{"ru":"Нейромедиаторы напрямую","en":"Neurotransmitters directly","ko":"신경전달물질 직접","ja":"神経伝達物質の直接測定"},{"ru":"Генетический код","en":"The genetic code","ko":"유전자 코드","ja":"遺伝コード"}],"c":1,"e":{"ru":"фМРТ ловит BOLD-сигнал — изменение соотношения оксигенированной и деоксигенированной крови возле активных зон.","en":"fMRI detects the BOLD signal — changes in the ratio of oxygenated to deoxygenated blood near active regions.","ko":"fMRI는 BOLD 신호를 감지합니다. 활동 영역 근처의 산소화 혈액 비율 변화입니다.","ja":"fMRIはBOLD信号を検出します。活動領域近くの酸素化血液の比率変化です。"}},{"q":{"ru":"Какой метод даёт лучшее временное разрешение?","en":"Which method offers the best temporal resolution?","ko":"어떤 방법이 시간 분해능이 가장 좋나요?","ja":"時間分解能が最も高いのは？"},"o":[{"ru":"МРТ","en":"MRI","ko":"MRI","ja":"MRI"},{"ru":"фМРТ","en":"fMRI","ko":"fMRI","ja":"fMRI"},{"ru":"ЭЭГ","en":"EEG","ko":"EEG","ja":"EEG"},{"ru":"КТ","en":"CT","ko":"CT","ja":"CT"}],"c":2,"e":{"ru":"ЭЭГ регистрирует активность с точностью до миллисекунд, но плохо определяет источник сигнала в глубине.","en":"EEG registers activity within milliseconds but poorly localizes deep sources.","ko":"EEG는 밀리초 단위로 기록하지만 깊은 곳의 신호원 찾기는 약합니다.","ja":"EEGはミリ秒単位で記録しますが、深部の信号源特定は苦手です。"}},{"q":{"ru":"На чём основано МРТ?","en":"What is MRI based on?","ko":"MRI의 원리는?","ja":"MRIの原理は？"},"o":[{"ru":"Рентгеновские лучи","en":"X-rays","ko":"X선","ja":"X線"},{"ru":"Магнитное поле и радиоволны","en":"Magnetic field and radio waves","ko":"자기장과 전파","ja":"磁場と電波"},{"ru":"Ультразвук","en":"Ultrasound","ko":"초음파","ja":"超音波"},{"ru":"Инфракрасный свет","en":"Infrared light","ko":"적외선","ja":"赤外線"}],"c":1,"e":{"ru":"МРТ использует сильное магнитное поле и радиоволны, чтобы «выслушать» отклик атомов водорода в тканях.","en":"MRI uses a strong magnetic field and radio waves to listen to the response of hydrogen atoms in tissue.","ko":"MRI는 강한 자기장과 전파로 조직 내 수소 원자의 반응을 들여다봅니다.","ja":"MRIは強磁場と電波で組織内の水素原子の応答を読み取ります。"}},{"q":{"ru":"Главное ограничение фМРТ?","en":"The main limitation of fMRI?","ko":"fMRI의 주요 한계는?","ja":"fMRIの主な限界は？"},"o":[{"ru":"Слишком высокая цена","en":"Too expensive","ko":"비용이 너무 비쌈","ja":"費用が高すぎる"},{"ru":"Сигнал косвенный и запаздывает на секунды","en":"The signal is indirect and lags by seconds","ko":"신호가 간접적이고 수 초 지연","ja":"信号が間接的で数秒遅れる"},{"ru":"Нельзя использовать на людях","en":"Cannot be used on humans","ko":"사람에게 사용 불가","ja":"人には使えない"},{"ru":"Не видит мозга вообще","en":"Does not see the brain at all","ko":"뇌가 전혀 보이지 않음","ja":"脳がまったく見えない"}],"c":1,"e":{"ru":"Кровоток реагирует на активность с задержкой в несколько секунд — это ставит предел временному разрешению.","en":"Blood flow responds to activity with a delay of seconds, which caps temporal resolution.","ko":"혈류 반응은 수 초 지연되며, 이것이 시간 분해능의 한계입니다.","ja":"血流反応は数秒の遅れがあり、これが時間分解能の限界です。"}},{"q":{"ru":"Что может ЭЭГ лучше всего?","en":"What is EEG best at?","ko":"EEG가 가장 잘하는 것은?","ja":"EEGが最も得意なことは？"},"o":[{"ru":"Смотреть на отдельные нейроны","en":"Looking at single neurons","ko":"개별 뉴런 관찰","ja":"単一ニューロンの観察"},{"ru":"Следить за динамикой ритмов во времени","en":"Tracking rhythm dynamics over time","ko":"리듬의 시간적 변화 추적","ja":"リズムの時間的変化の追跡"},{"ru":"Показывать точную глубину активности","en":"Showing exact depth of activity","ko":"활동의 정확한 깊이 표시","ja":"活動の正確な深さの表示"},{"ru":"Заменять МРТ полностью","en":"Fully replacing MRI","ko":"MRI 완전 대체","ja":"MRIの完全な代替"}],"c":1,"e":{"ru":"ЭЭГ идеальна для ритмов и эпилепсии: альфа, тета, дельта — читаются почти в реальном времени.","en":"EEG is ideal for rhythms and epilepsy: alpha, theta, delta are read almost in real time.","ko":"EEG는 리듬과 간질에 이상적입니다. 알파, 세타, 델타가 거의 실시간으로 읽힙니다.","ja":"EEGはリズムとてんかんに理想的で、アルファ波やシータ波をほぼリアルタイムで読めます。"}}]},{"id":"myth","icon":"🧩","title":{"ru":"Мифы о мозге","en":"Brain myths","ko":"뇌 미신","ja":"脳の神話"},"desc":{"ru":"Проверь, что из этого правда.","en":"Check which of it is true.","ko":"무엇이 진실인지 확인하세요.","ja":"どれが真実か確かめましょう。"},"q":[{"q":{"ru":"Мы используем только 10% мозга. Правда?","en":"We use only 10% of our brain. True?","ko":"우리는 뇌의 10%만 사용한다. 사실인가요?","ja":"私たちは脳の10%しか使わない。本当ですか？"},"o":[{"ru":"Правда","en":"True","ko":"사실이다","ja":"本当"},{"ru":"Ложь","en":"False","ko":"거짓이다","ja":"嘘"},{"ru":"Только у гениев","en":"Only for geniuses","ko":"천재만 해당","ja":"天才のみ"},{"ru":"Только во сне","en":"Only during sleep","ko":"수면 중에만","ja":"睡眠中のみ"}],"c":1,"e":{"ru":"ПЭТ и фМРТ показывают: за день активны практически все области. Миф возник из-за неточной цитаты начала XX века.","en":"PET and fMRI show nearly all areas are active daily. The myth grew from a loose quote of the early 20th century.","ko":"PET와 fMRI는 거의 모든 영역이 매일 활성화됨을 보여줍니다. 20세기 초의 부정확한 인용이 미신을 낳았습니다.","ja":"PETやfMRIではほぼ全領域が日々活動していることが分かります。20世紀初頭の不正確な引用が神話を生みました。"}},{"q":{"ru":"Люди делятся на «левополушарных» и «правополушарных»?","en":"Are people divided into left-brained and right-brained?","ko":"사람은 좌뇌형과 우뇌형으로 나뉘나요?","ja":"人は左脳型と右脳型に分かれますか？"},"o":[{"ru":"Да, это доказано","en":"Yes, proven","ko":"네, 증명됨","ja":"はい、証明済み"},{"ru":"Нет — полушария работают вместе","en":"No — the hemispheres work together","ko":"아니요 — 반구는 함께 작동","ja":"いいえ — 半球は協調して働く"},{"ru":"Только у левшей","en":"Only in left-handers","ko":"왼손잡이만","ja":"左利きのみ"},{"ru":"Только у детей","en":"Only in children","ko":"아이들만","ja":"子どものみ"}],"c":1,"e":{"ru":"Оба полушария участвуют почти во всех задачах; специализация есть, но «доминирование» — преувеличение.","en":"Both hemispheres take part in nearly all tasks; there is specialization, but «dominance» is an exaggeration.","ko":"양 반구는 거의 모든 과제에 참여합니다. 특수화는 있지만 「지배」는 과장입니다.","ja":"両半球はほぼ全課題に関与します。特化はありますが「支配」は誇張です。"}},{"q":{"ru":"После 25 лет мозг больше не меняется?","en":"After 25 the brain stops changing?","ko":"25세 이후 뇌는 변하지 않나요?","ja":"25歳以降の脳は変わらない？"},"o":[{"ru":"Да","en":"Yes","ko":"네","ja":"はい"},{"ru":"Нет — пластичность сохраняется всю жизнь","en":"No — plasticity lasts a lifetime","ko":"아니요 — 가소성은 평생 유지","ja":"いいえ — 可塑性は生涯続く"},{"ru":"Только у спортсменов","en":"Only in athletes","ko":"운동선수만","ja":"アスリートのみ"},{"ru":"Наука не знает","en":"Science doesn't know","ko":"과학은 모른다","ja":"科学は知らない"}],"c":0,"e":{"ru":"Миф! Нейрогенез в гиппокампе и перестройка связей продолжаются и во взрослом возрасте.","en":"Myth! Hippocampal neurogenesis and rewiring continue into adulthood.","ko":"미신입니다. 해마의 신경발생과 연결 재편은 성인기에도 계속됩니다.","ja":"神話です。海馬の神経新生と結合の再編は成人期にも続きます。"}},{"q":{"ru":"«Эффект Моцарта» делает человека умнее?","en":"Does the Mozart effect make you smarter?","ko":"「モーツァルト効果」は人を賢くしますか？","ja":"「モーツァルト効果」で人は賢くなりますか？"},"o":[{"ru":"Да, навсегда","en":"Yes, forever","ko":"네, 영원히","ja":"はい、永久に"},{"ru":"Нет — эффект кратковременный и связан с активацией, а не интеллектом","en":"No — the effect is short-lived and about arousal, not intelligence","ko":"아니요 — 효과는 일시적이며 지능이 아닌 각성과 관련","ja":"いいえ — 効果は短期的で知能ではなく覚醒に関係"},{"ru":"Только у младенцев","en":"Only in infants","ko":"영아만","ja":"乳児のみ"},{"ru":"Только при 10 часов в день","en":"Only with 10 hours a day","ko":"하루 10시간만","ja":"1日10時間のみ"}],"c":1,"e":{"ru":"Rauscher и коллеги (1993) фиксировали краткосрочный подъём на пространственных задачах; рост IQ не подтверждён.","en":"Rauscher et al. (1993) found a short-term boost on spatial tasks; no IQ gain was confirmed.","ko":"Rauscher 등(1993)은 공간 과제에서 일시적 향상을 보였지만 IQ 상승은 확인되지 않았습니다.","ja":"Rauscherら（1993）は空間課題での一時的な向上を示したが、IQ向上は確認されていません。"}},{"q":{"ru":"Учебные стили: «аудиал учатся на слух, визуал — глазами». Научно?","en":"Learning styles: auditory learners learn by ear, visual by eyes. Scientific?","ko":"학습 스타일: 청각형은 귀로, 시각형은 눈으로 학습한다. 과학적?","ja":"学習スタイル：聴覚型は耳で、視覚型は目で学ぶ。科学的？"},"o":[{"ru":"Да","en":"Yes","ko":"네","ja":"はい"},{"ru":"Нет — подстройка под стили не улучшает результат","en":"No — matching styles does not improve outcomes","ko":"아니요 — 스타일 맞춤은 결과를 개선하지 않음","ja":"いいえ — スタイル合わせは成果を改善しない"},{"ru":"Да, но только у взрослых","en":"Yes, but only in adults","ko":"네, 성인만","ja":"はい、成人のみ"},{"ru":"Зависит от погоды","en":"Depends on the weather","ko":"날씨에 따라 다름","ja":"天候次第"}],"c":1,"e":{"ru":"Метаанализы не находят пользы от подстройки под «стили»; работают активное вспоминание и распределённое повторение.","en":"Meta-analyses find no benefit from style-matching; active recall and spaced repetition work.","ko":"메타분석에서 스타일 맞춤의 효과는 없었습니다. 능동적 회상과 분산 반복이 효과적입니다.","ja":"メタ分析ではスタイル合わせの効果は見つかっていません。能動的想起と分散反復が有効です。"}}]},{"id":"sleep","icon":"😴","title":{"ru":"Сон","en":"Sleep","ko":"수면","ja":"睡眠"},"desc":{"ru":"Что мозг делает, пока вы спите.","en":"What the brain does while you sleep.","ko":"당신이 자는 동안 뇌가 하는 일.","ja":"眠っている間に脳がすること。"},"q":[{"q":{"ru":"Сколько стадий у сна (включая REM)?","en":"How many sleep stages are there (including REM)?","ko":"수면 단계는 몇 개인가요(REM 포함)?","ja":"睡眠段階はいくつありますか（REM含む）？"},"o":[{"ru":"2","en":"2","ko":"2","ja":"2"},{"ru":"3","en":"3","ko":"3","ja":"3"},{"ru":"4 NREM + REM","en":"4 NREM + REM","ko":"4 NREM + REM","ja":"4 NREM + REM"},{"ru":"8","en":"8","ko":"8","ja":"8"}],"c":2,"e":{"ru":"NREM делится на три стадии (N1, N2, N3-медленноволновой сон) плюс REM — всего четыре сегмента цикла.","en":"NREM has three stages (N1, N2, N3 slow-wave sleep) plus REM — four segments of the cycle.","ko":"NREM은 세 단계(N1, N2, N3 서파 수면)로 나뉘고 REM까지 총 네 구간입니다.","ja":"NREMは3段階（N1、N2、N3徐波睡眠）に分かれ、REMを含め計4区分です。"}},{"q":{"ru":"Когда сны самые яркие и странные?","en":"When are dreams the most vivid and strange?","ko":"가장 생생하고 기묘한 꿈은 언제?","ja":"最も生々しく奇妙な夢はいつ？"},"o":[{"ru":"В глубоком N3","en":"In deep N3","ko":"깊은 N3에서","ja":"深いN3で"},{"ru":"В REM-фазе","en":"In REM sleep","ko":"REM 단계에서","ja":"REM睡眠中"},{"ru":"При засыпании","en":"While falling asleep","ko":"잠들 때","ja":"入眠時"},{"ru":"Ровно в полдень","en":"Exactly at noon","ko":"정오에","ja":"正午ちょうど"}],"c":1,"e":{"ru":"REM-сон: глаза двигаются, а ЭЭГ похожа на бодрствование — здесь живут самые яркие сны.","en":"REM sleep: eyes move and the EEG resembles wakefulness — the most vivid dreams live here.","ko":"REM 수면: 눈이 움직이고 EEG는 깨어있을 때와 유사합니다. 가장 생생한 꿈이 여기서 나타납니다.","ja":"REM睡眠：眼球運動があり、脳波は覚醒時と似ます。最も生々しい夢はここに出ます。"}},{"q":{"ru":"Что происходит с памятью во сне?","en":"What happens to memory during sleep?","ko":"수면 중 기억에 일어나는 일은?","ja":"睡眠中、記憶に何が起きますか？"},"o":[{"ru":"Она полностью стирается","en":"It is fully erased","ko":"완전히 지워짐","ja":"完全に消去される"},{"ru":"Консолидируется — переносится в долговременное хранение","en":"It consolidates — moves into long-term storage","ko":"통합되어 장기 저장으로 이동","ja":"固定され長期貯蔵へ移る"},{"ru":"Она не затрагивается","en":"It is untouched","ko":"영향 없음","ja":"影響されない"},{"ru":"Удваивается","en":"It doubles","ko":"두 배가 됨","ja":"2倍になる"}],"c":1,"e":{"ru":"Повторное «проигрывание» активности гиппокампа во сне укрепляет новые следы памяти.","en":"Replay of hippocampal activity during sleep strengthens new memory traces.","ko":"수면 중 해마 활동의 재생이 새로운 기억 흔적을 강화합니다.","ja":"睡眠中の海馬活動の再生が新しい記憶痕跡を強化します。"}},{"q":{"ru":"Сколько сна нужно взрослому в среднем?","en":"How much sleep does an adult need on average?","ko":"성인에게 필요한 평균 수면량은?","ja":"成人が必要とする平均睡眠時間は？"},"o":[{"ru":"4-5 часов","en":"4-5 hours","ko":"4-5시간","ja":"4～5時間"},{"ru":"7-9 часов","en":"7-9 hours","ko":"7-9시간","ja":"7～9時間"},{"ru":"11-12 часов","en":"11-12 hours","ko":"11-12시간","ja":"11～12時間"},{"ru":"Не нужно вообще","en":"None at all","ko":"필요 없음","ja":"不要"}],"c":1,"e":{"ru":"Консенсус AASM/NSF: взрослым — 7-9 часов; меньше 6 — риск для внимания и здоровья.","en":"AASM/NSF consensus: adults need 7-9 hours; under 6 risks attention and health.","ko":"AASM/NSF 합의: 성인은 7-9시간. 6시간 미만은 주의력과 건강에 위험.","ja":"AASM/NSFの合意：成人は7～9時間。6時間未満は注意と健康にリスク。"}},{"q":{"ru":"Можно ли «доспать» выходными за всю неделю?","en":"Can weekend sleep repay a whole week's deficit?","ko":"주말에 일주일치 잠을 만회할 수 있나요?","ja":"週末で一週間分の睡眠を取り戻せますか？"},"o":[{"ru":"Да, полностью","en":"Yes, fully","ko":"네, 완전히","ja":"はい、完全に"},{"ru":"Частично — но метаболические и когнитивные «долги» остаются","en":"Partly — but metabolic and cognitive debts remain","ko":"부분적으로 — 대사적·인지적 「빚」은 남음","ja":"部分的に — 代謝と認知の「負債」は残る"},{"ru":"Нет, совсем","en":"No, not at all","ko":"아니요, 전혀","ja":"いいえ、全く"},{"ru":"Только если спать днём","en":"Only if napping","ko":"낮잠을 자야만","ja":"昼寝すればのみ"}],"c":1,"e":{"ru":"Исследования (напр. Depner et al., 2019) показывают: дозы сна на выходных не отменяют эффектов недосыпа.","en":"Studies (e.g., Depner et al., 2019) show weekend catch-up sleep does not erase the effects of sleep debt.","ko":"연구(Depner 등, 2019)에 따르면 주말 보충 수면은 수면 부채의 영향을 지우지 못합니다.","ja":"研究（Depnerら、2019）では、週末の補償睡眠は睡眠負債の影響を消しません。"}}]}];
const MYTHS=[{"t":{"ru":"10% мозга","en":"The 10% brain","ko":"뇌의 10%","ja":"脳の10%"},"s":"no","c":{"ru":"Используем только десятую часть мозга.","en":"We use only a tenth of our brain.","ko":"뇌의 10분의 1만 사용한다.","ja":"脳の1割しか使わない。"},"x":{"ru":"ПЭТ и фМРТ за день фиксируют активность практически во всех областях. Миф продаёт «скрытые резервы», которых нет.","en":"PET and fMRI detect activity in almost all areas daily. The myth sells hidden reserves that simply don't exist.","ko":"PET와 fMRI는 하루 동안 거의 모든 영역의 활성을 기록합니다. 미신은 존재하지 않는 「숨은 잠재력」을 팝니다.","ja":"PETやfMRIは1日でほぼ全領域の活動を記録します。神話は存在しない「隠れた可能性」を売るものです。"},"src":{"ru":"Beyerstein, 1999 · Nature Reviews Neuroscience","en":"Beyerstein, 1999 · Nature Reviews Neuroscience","ko":"Beyerstein, 1999 · Nature Reviews Neuroscience","ja":"Beyerstein, 1999 · Nature Reviews Neuroscience"}},{"t":{"ru":"Левое и правое полушарие","en":"Left and right hemispheres","ko":"좌뇌와 우뇌","ja":"左脳と右脳"},"s":"no","c":{"ru":"Люди делятся на «логиков» и «художников» по полушарию.","en":"People split into «logicians» and «artists» by hemisphere.","ko":"사람은 반구에 따라 「논리형」과 「예술형」으로 나뉜다.","ja":"人は半球によって「論理型」と「芸術型」に分かれる。"},"x":{"ru":"Специализация полушарий существует (например, речь чаще слева), но обе стороны работают вместе в любом сложном деле.","en":"Hemisphere specialization exists (speech is usually left), but both sides work together in any complex task.","ko":"반구 특수화는 존재하지만(예: 언어는 보통 좌뇌) 복잡한 과제에서는 양쪽이 함께 작동합니다.","ja":"半球の特化は存在します（言語は通常左）が、複雑な課題では両側が協調します。"},"src":{"ru":"Corballis, 2014 · PMC","en":"Corballis, 2014 · PMC","ko":"Corballis, 2014 · PMC","ja":"Corballis, 2014 · PMC"}},{"t":{"ru":"Эффект Моцарта","en":"The Mozart effect","ko":"모차르트 효과","ja":"モーツァルト効果"},"s":"mid","c":{"ru":"Классика делает умнее.","en":"Classical music makes you smarter.","ko":"클래식이 더 똑똑하게 만든다.","ja":"クラシックは賢くする。"},"x":{"ru":"Краткосрочный подъём на пространственных задачах есть — но это скорее общая активация и настроение, а не рост интеллекта.","en":"There is a short-term boost on spatial tasks — but it's arousal and mood, not an IQ gain.","ko":"공간 과제에서 일시적 향상은 있지만, IQ 상승이 아니라 각성과 기분의 효과입니다.","ja":"空間課題での一時的向上はありますが、IQ向上ではなく覚醒と気分の効果です。"},"src":{"ru":"Rauscher et al., 1993 · Pietschnig et al., 2010","en":"Rauscher et al., 1993 · Pietschnig et al., 2010","ko":"Rauscher et al., 1993 · Pietschnig et al., 2010","ja":"Rauscher et al., 1993 · Pietschnig et al., 2010"}},{"t":{"ru":"Пластичность после 25","en":"Plasticity after 25","ko":"25세 이후 가소성","ja":"25歳以降の可塑性"},"s":"no","c":{"ru":"Мозг после 25 лет не способен меняться.","en":"The brain after 25 cannot change.","ko":"25세 이후 뇌는 변할 수 없다.","ja":"25歳以降の脳は変わらない。"},"x":{"ru":"Пластичность снижается с возрастом, но не исчезает: обучение новому в любом возрасте перестраивает связи.","en":"Plasticity declines with age but does not vanish: learning new things rewires connections at any age.","ko":"가소성은 나이에 따라 감소하지만 사라지지 않습니다. 새로운 학습은 어떤 나이에도 연결을 재편합니다.","ja":"可塑性は加齢で減少しますが消えません。新しい学習はどんな年齢でも結合を再編します。"},"src":{"ru":"Lövdén et al., 2010 · Nature Reviews Neuroscience","en":"Lövdén et al., 2010 · Nature Reviews Neuroscience","ko":"Lövdén et al., 2010 · Nature Reviews Neuroscience","ja":"Lövdén et al., 2010 · Nature Reviews Neuroscience"}},{"t":{"ru":"Сахар и гиперактивность","en":"Sugar and hyperactivity","ko":"설탕과 과잉행동","ja":"砂糖と多動"},"s":"no","c":{"ru":"Сладости делают детей гиперактивными.","en":"Sweets make children hyperactive.","ko":"단 것은 아이들을 과잉행동으로 만든다.","ja":"甘いものは子どもを多動にする。"},"x":{"ru":"Двойные слепые эксперименты не находят связи между сахаром и гиперактивностью; связь скорее ожидание родителей.","en":"Double-blind experiments find no link between sugar and hyperactivity; the link is mostly parental expectation.","ko":"이중맹 실험은 설탕과 과잉행동의 연관을 찾지 못했습니다. 연관은 주로 부모의 기대입니다.","ja":"二重盲検実験では砂糖と多動の関連は見つかりません。関連は主に親の期待です。"},"src":{"ru":"Wolraich et al., 1995 · JAMA","en":"Wolraich et al., 1995 · JAMA","ko":"Wolraich et al., 1995 · JAMA","ja":"Wolraich et al., 1995 · JAMA"}},{"t":{"ru":"Мозг «выключается» во сне","en":"The brain shuts off during sleep","ko":"수면 중 뇌가 꺼진다","ja":"睡眠中、脳はシャットダウンする"},"s":"no","c":{"ru":"Во сне мозг почти неактивен.","en":"During sleep the brain is almost inactive.","ko":"수면 중 뇌는 거의 비활성이다.","ja":"睡眠中、脳はほぼ不活性だ。"},"x":{"ru":"Мозг во сне активен: очистка метаболитов, консолидация памяти, сновидения — это работа, а не простой.","en":"The brain is active during sleep: metabolite clearance, memory consolidation, dreaming — work, not downtime.","ko":"수면 중 뇌는 활동적입니다. 대사물질 정리, 기억 통합, 꿈 — 일이지 쉼이 아닙니다.","ja":"睡眠中の脳は活動的です。代謝物の除去、記憶の固定、夢 — 働きであって休息ではありません。"},"src":{"ru":"Xie et al., 2013 · Science","en":"Xie et al., 2013 · Science","ko":"Xie et al., 2013 · Science","ja":"Xie et al., 2013 · Science"}},{"t":{"ru":"Левши креативнее","en":"Left-handers are more creative","ko":"왼손잡이가 더 창의적","ja":"左利きはより創造的"},"s":"mid","c":{"ru":"Левши по природе более творческие.","en":"Left-handers are naturally more creative.","ko":"왼손잡이는 본질적으로 더 창의적이다.","ja":"左利きは本質的により創造的だ。"},"x":{"ru":"Различия в средних показателях креативности между левшами и правшами малы; отдельные исследования показывают слабые эффекты, но общего правила нет.","en":"Average creativity differences between left- and right-handers are small; some studies show weak effects, but no general rule.","ko":"왼손잡이와 오른손잡이의 창의성 평균 차이는 작습니다. 일부 연구에서 약한 효과가 있지만 일반 법칙은 없습니다.","ja":"左利きと右利きの創造性の平均差は小さい。弱い効果を示す研究もあるが、一般法則はない。"},"src":{"ru":"Prichard et al., 2013 · Frontiers in Psychology","en":"Prichard et al., 2013 · Frontiers in Psychology","ko":"Prichard et al., 2013 · Frontiers in Psychology","ja":"Prichard et al., 2013 · Frontiers in Psychology"}},{"t":{"ru":"Слушание во сне","en":"Learning while sleeping","ko":"잠자는 동안 학습","ja":"眠っている間の学習"},"s":"no","c":{"ru":"Можно выучить язык, слушая записи во сне.","en":"You can learn a language by listening to recordings while asleep.","ko":"자는 동안 녹음을 들으면 언어를 배울 수 있다.","ja":"眠っている間に録音を聞いて語学を習得できる。"},"x":{"ru":"Сложное обучение во сне не работает. Зато во сне закрепляется то, что вы учили наяву — тонкое ассоциативное обучение возможно.","en":"Complex learning during sleep does not work. But sleep consolidates what you learned while awake — fine associative learning is possible.","ko":"수면 중 복잡한 학습은 효과가 없습니다. 그러나 깨어 있을 때 학습한 내용은 수면 중 강화됩니다.","ja":"睡眠中の複雑な学習は機能しません。ただし覚醒時に学習した内容は睡眠中に固定されます。"},"src":{"ru":"Andrillon et al., 2017 · Nature Communications","en":"Andrillon et al., 2017 · Nature Communications","ko":"Andrillon et al., 2017 · Nature Communications","ja":"Andrillon et al., 2017 · Nature Communications"}}];
const OPENQ=[{"t":{"ru":"Сознание — почему мы вообще что-то ощущаем?","en":"Consciousness — why do we experience anything at all?","ko":"의식 — 왜 우리는 무언가를 경험하는가?","ja":"意識 — なぜ私たちは何かを体験するのか？"},"x":{"ru":"Нейронаука умеет исследовать активность мозга, связанную с вниманием и восприятием. Но остаётся фундаментальный вопрос: почему физические процессы в нервной ткани сопровождаются субъективным переживанием?","en":"Neuroscience can study brain activity tied to attention and perception. Yet the fundamental question remains: why do physical processes in nervous tissue come with subjective experience?","ko":"신경과학은 주의와 지각에 연결된 뇌 활동을 연구할 수 있습니다. 그러나 근본적인 질문이 남습니다: 신경 조직의 물리적 과정은 왜 주관적 경험을 수반하는가?","ja":"神経科学は注意や知覚に関わる脳活動を研究できます。しかし根本的な問いが残ります。神経組織の物理的過程はなぜ主観的体験を伴うのか？"},"u":{"ru":"какие нейронные процессы необходимы для сознательного опыта и достаточно ли их для объяснения субъективных переживаний","en":"which neural processes are necessary for conscious experience and whether they suffice to explain subjective feelings","ko":"의식적 경험에 필요한 신경 과정이 무엇이며, 주관적 경험을 설명하기에 충분한지","ja":"意識的経験に必要な神経過程は何か、そして主観的体験を説明するのに十分か"}},{"t":{"ru":"Память — где на самом деле хранится воспоминание?","en":"Memory — where is a memory actually stored?","ko":"기억 — 기억은 실제로 어디에 저장되는가?","ja":"記憶 — 記憶は実際どこに保存されるのか？"},"x":{"ru":"Найдены энграммные клетки — группы нейронов, участвующие в представлении конкретных воспоминаний. Но память редко живёт в одной области: компоненты опыта распределены между несколькими сетями.","en":"Engram cells — groups of neurons representing specific memories — have been found. But memory rarely lives in one area: components of experience are distributed across several networks.","ko":"엔그램 세포 — 특정 기억을 표현하는 뉴런 집단 — 가 발견되었습니다. 그러나 기억은 한 영역에만 있지 않고 여러 네트워크에 분산됩니다.","ja":"エングラム細胞 — 特定の記憶を表すニューロン群 — が発見されています。しかし記憶は一つの領域にだけあるのではなく、複数のネットワークに分散します。"},"u":{"ru":"как распределённые нейронные изменения превращаются в устойчивое, целостное воспоминание","en":"how distributed neural changes function renderQuizzes(){

  $("quizGrid").innerHTML=QUIZZES.map((q,i)=>'<div class="qcard" onclick="openQuiz('+i+')"><span class="lock">'+esc(L().ready)+'</span><div class="ic">'+q.icon+'</div><h4>'+esc(tx(q.title))+'</h4><p>'+esc(tx(q.desc))+'</p><div class="meta">'+q.q.length+' '+esc(L().qof)+'</div></div>').join("");

function closeQuizBox(){$("quizBox").innerHTML="";if(tmr){clearInterval(tmr);tmr=null;}}
function openQuiz(i){
  if(tmr){clearInterval(tmr);tmr=null;}
  cur=QUIZZES[i];qi=0;score=0;renderQ();
  document.getElementById("quizzes").scrollIntoView({behavior:"smooth"});
}
function renderQ(){
  tl=30;answered=false;const q=cur.q[qi];
  $("quizBox").innerHTML='<div class="qbox"><div class="qtop"><span>'+esc(tx(cur.title))+' · '+esc(L().qof)+' '+(qi+1)+'/'+cur.q.length+'</span><span class="tl" id="tlsp">30 s</span></div><div class="qtext">'+esc(tx(q.q))+'</div><div id="optbox">'+q.o.map((o,i)=>'<button class="opt" onclick="answer('+i+')">'+esc(tx(o))+'</button>').join("")+'</div><div id="explbox"></div></div>';
  tmr=setInterval(tick,1000);
}
function tick(){if(!answered){tl--;const s=$("tlsp");if(s)s.textContent=tl+' s';if(tl<=0)reveal(-1);}}
function answer(i){if(answered)return;answered=true;if(tmr){clearInterval(tmr);tmr=null;}reveal(i);}
function reveal(i){
  const q=cur.q[qi],ok=i===q.c;let good=i>=0&&ok;
  if(i===-1)good=false;
  if(i>=0&&ok)score++;
  const btns=$("optbox").querySelectorAll(".opt");
  btns.forEach((b,bi)=>{b.disabled=true;if(bi===q.c)b.classList.add("ok");else if(bi===i&&i!==-1)b.classList.add("bad");});
  const head=(i===-1)?L().timeOut:(ok?L().correct:L().wrong);
  $("explbox").innerHTML='<div class="expl"><b>'+esc(head)+'</b> '+esc(tx(q.e))+'</div><button class="btn" onclick="nextQ()">'+esc(L().next)+' →</button>';
}
function nextQ(){qi++;if(qi>=cur.q.length)showRes();else renderQ();}
function showRes(){
  const pct=Math.round(score/cur.q.length*100);
  $("quizBox").innerHTML='<div class="qbox resb"><div class="big">'+score+'/'+cur.q.length+'</div><p style="color:var(--mut);margin:10px 0 18px">'+esc(L().score)+' — '+pct+'%</p><button class="btn" onclick="openQuiz(QUIZZES.indexOf(cur))">'+esc(L().again)+'</button> <button class="btn ghost" onclick="closeQuizBox()" style="margin-left:8px">'+esc(L().close)+'</button></div>';
}

/* ---------- Stroop ---------- */
let stOn=false,stN=0,stOk=0,stRt=[],stColor=-1,stWord=-1,stT0=0;
function renderStroopIdle(){$("stroopBox").innerHTML='<button class="btn" onclick="startStroop()">'+esc(L().stStart)+'</button>';}
function startStroop(){stOn=true;stN=0;stOk=0;stRt=[];stroopRound();}
const stColors={ru:["красный","синий","зелёный","жёлтый"],en:["red","blue","green","yellow"],ko:["빨강","파랑","초록","노랑"],ja:["赤","青","緑","黄色"]};
const stHex=["#e0556a","#5a8bf6","#5ad17c","#ffd93b"];
function stroopRound(){
  if(stN>=10){stroopDone();return;}
  const c=stColors[lang]||stColors.ru;stWord=Math.floor(Math.random()*4);
  stColor=(Math.random()<0.75)?{0:1,1:2,2:3,3:0}[stWord]:stWord;
  const order=[0,1,2,3].sort(()=>Math.random()-0.5);
  $("stroopBox").innerHTML='<div class="qtop" style="align-self:stretch"><span>'+esc(L().stRound)+' '+(stN+1)+'/10</span><span class="tl" id="stTsp">—</span></div><div class="stword" style="color:'+stHex[stColor]+'">'+esc(c[stWord])+'</div><div class="sbtns">'+order.map(ci=>'<button class="sbtn" style="color:'+stHex[ci]+'" onclick="stroopClick('+ci+')">'+esc(c[ci])+'</button>').join("")+'</div>';
  stT0=Date.now();
}
function stroopClick(ci){
  if(!stOn)return;const rt=Date.now()-stT0;stRt.push(rt);if(ci===stColor)stOk++;
  stN++;stroopRound();
}
function stroopDone(){
  stOn=false;const avg=stRt.length?Math.round(stRt.reduce((a,b)=>a+b,0)/stRt.length):0;
  $("stroopBox").innerHTML='<div class="resb" style="width:100%"><div class="big" style="color:var(--acc2)">'+avg+' '+esc(L().stAvg).toLowerCase()+'</div><p style="color:var(--mut);margin:8px 0">'+esc(L().stAcc)+': '+stOk+'/10</p><button class="btn" onclick="startStroop()">'+esc(L().stAgain)+'</button></div>';
}
/* ---------- survey ---------- */
let svAns=[];
function renderSurvey(){
  svAns=Array(SURVEY.length).fill(-1);
  $("svBox").innerHTML=SURVEY.map((s,i)=>'<div class="svrow"><span>'+esc(tx(s))+'</span><span class="svbtns">'+[1,2,3,4,5].map(v=>'<button class="svb" id="sv'+i+'_'+v+'" onclick="svPick('+i+','+v+')">'+v+'</button>').join("")+'</span></div>').join("")+'<button class="btn" style="margin-top:16px" onclick="svCalc()">'+esc(L().svBtn)+'</button><div id="svRes"></div>';
}
function svPick(i,v){svAns[i]=v;[1,2,3,4,5].forEach(x=>{$("sv"+i+"_"+x).classList.toggle("sel",x===v);});}
function svCalc(){
  if(svAns.some(v=>v<0))return;
  const inv=v=>6-v;
  const sleep=Math.round(100*(((svAns[0]+inv(svAns[1])+inv(svAns[2])+svAns[9])/4)/5));
  const att=Math.round(100*(((inv(svAns[3])+inv(svAns[4])+inv(svAns[7]))/3)/5));
  const fat=Math.round(100*(((svAns[5]+svAns[6]+svAns[8])/3)/5));
  $("svRes").innerHTML='<div class="bar3"><div class="row"><div class="lab"><span>'+esc(L().scS)+'</span><span>'+sleep+'%</span></div><div class="tr"><div class="fl" style="width:'+sleep+'%"></div></div></div><div class="row"><div class="lab"><span>'+esc(L().scA)+'</span><span>'+att+'%</span></div><div class="tr"><div class="fl" style="width:'+att+'%"></div></div></div><div class="row"><div class="lab"><span>'+esc(L().scF)+'</span><span>'+fat+'%</span></div><div class="tr"><div class="fl" style="width:'+fat+'%"></div></div></div></div><p style="color:var(--mut);font-size:13px;margin-top:10px">'+esc(L().svNote)+'</p>';
}
/* ---------- stats ---------- */
function renderStats(){
  $("stTag").textContent=L().stTag;$("stTitle").textContent=L().stTitle;$("stDemo").textContent=L().stDemo;
  const nQ=QUIZZES.reduce((a,q)=>a+q.q.length,0);
  const cells=[[QUIZZES.length,L().nQz],[nQ,L().nQ],[2,L().nCog],[MYTHS.length,L().nMy]];
  $("statGrid").innerHTML=cells.map(c=>'<div class="s1"><div class="n">'+c[0]+'</div><div class="l">'+esc(c[1])+'</div></div>').join("");
  const demo=[[74,"main"],[68,"meth"],[81,"mem"],[63,"myth"],[77,"sleep"]];
  $("dbar").innerHTML=demo.map(d=>{const q=QUIZZES.find(x=>x.id===d[1]);return '<div class="row"><div class="lab"><span>'+esc(tx(q.title))+'</span><span>'+d[0]+'%</span></div><div class="tr"><div class="fl" style="width:'+d[0]+'%"></div></div></div>';}).join("");
}
/* ---------- research / collab / about / footer ---------- */
function renderRest(){
  $("rsTag").textContent=L().rsTag;$("rsTitle").textContent=L().rsTitle;$("rsSub").textContent=L().rsSub;
  $("methNote").textContent=L().meth;
  $("resGrid").innerHTML=RES.map(r=>'<div class="rcard"><div class="num">'+esc(r.num)+'</div><h4>'+esc(tx(r.t))+'</h4><p>'+esc(tx(r.x))+'</p><div class="src">'+esc(tx(r.s))+'</div></div>').join("");
  $("clTag").textContent=L().clTag;$("clTitle").textContent=L().clTitle;$("clSub").textContent=L().clSub;$("clNote").textContent=L().clNote;
  $("univGrid").innerHTML=UNIV.map(u=>'<div class="u"><div class="c">'+esc(u.c)+'</div><h4>'+esc(u.n)+'</h4><p>'+esc(tx(u.d))+'</p></div>').join("");
  $("abTag").textContent=L().abTag;$("abTitle").textContent=L().abTitle;$("ab1").textContent=L().ab1;$("ab2").textContent=L().ab2;$("ab3").textContent=L().ab3;
  $("stages").innerHTML=L().stages.map(s=>'<div class="stage"><div class="st">'+esc(s[0])+'</div><p>'+esc(s[1])+'</p></div>').join("");
  $("ftT").textContent=L().ftT;$("ftX").textContent=L().ftX;
  $("ftBtns").innerHTML='<a class="btn ghost" href="https://t.me/neuroneuro26" target="_blank">'+esc(L().ftTg)+'</a><a class="btn ghost" href="mailto:neuroneuro26@gmail.com">neuroneuro26@gmail.com</a>';
  $("ftF").textContent=L().ftF;$("ftC").textContent=L().ftC;
}
/* ---------- modal ---------- */
$("mclose").onclick=function(){$("modal").classList.remove("on");};
$("modal").onclick=function(e){if(e.target===this)this.classList.remove("on");};
/* ---------- boot ---------- */
function renderAll(){buildNav();renderHome();renderQuizzes();renderLib();renderOpenQ();renderLab();renderStats();renderRest();}
buildLangs();renderAll();
</script>
